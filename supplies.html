<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>備品管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* ----- 施設の入力 ----- */
    .place-grid { display: grid; gap: 0 16px; }
    @media (min-width: 1000px) { .place-grid { grid-template-columns: 1fr 1fr; } }
    .sup-list { list-style: none; margin: 0; padding: 0; }
    .sup-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 8px 0; border-top: 1px solid var(--color-border); }
    .sup-row:first-child { border-top: none; }
    .sup-row.changed { background: var(--color-work-soft); margin: 0 -8px; padding: 8px; border-radius: var(--radius-sm); }
    .sup-name { flex: 1 1 150px; min-width: 0; font-size: 14px; font-weight: 500; }
    .sup-ctrl { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
    /* 「発注」と + − はいっしょに並べる(はなれて改行しない) */
    .order { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
    .order-label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); white-space: nowrap; }
    .sup-help { font-size: 11px; color: var(--color-text-muted); margin: -6px 0 6px; }
    /* 在庫のチップ: 足りない(基準より少ない)は赤、ちょうど基準はオレンジ、足りているは緑 */
    .stock-chip {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 64px; height: 36px; padding: 0 8px; cursor: pointer;
      font-family: var(--font-base); font-size: 14px; font-weight: 700; line-height: 1.1;
      border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
    }
    .stock-chip small { font-size: 9px; font-weight: 500; }
    .stock-chip:hover { box-shadow: var(--shadow-md); }
    .stock-low  { background: var(--color-danger-soft); border-color: var(--color-danger); color: var(--color-danger); }
    .stock-near { background: var(--color-work-soft); border-color: var(--color-work); color: var(--color-work-dark); }
    .stock-ok   { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary-dark); }
    .use-btn { height: 36px; }
    .stock-keys { margin: 0 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .stock-key { display: inline-block; min-width: 26px; padding: 0 6px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; text-align: center; }
    .stock-keys .stock-key:not(:first-child) { margin-left: 10px; }
    .house-sum .low { color: var(--color-danger); font-weight: 700; }
    /* 使ったあとに出る知らせ(取り消せる) */
    .toast {
      position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 10px; max-width: calc(100% - 20px);
      padding: 8px 8px 8px 14px; border-radius: var(--radius-md);
      background: var(--color-text); color: var(--color-surface); font-size: 13px; box-shadow: var(--shadow-md);
    }
    .toast button { flex: 0 0 auto; }
    .sup-name small { font-size: 11px; font-weight: 400; color: var(--color-text-muted); margin-left: 4px; }
    .sup-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .sup-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
    .sup-tag.requested { background: var(--color-work-soft); color: var(--color-work-dark); }
    .sup-tag.ordered   { background: var(--color-staff-soft); color: var(--color-staff); }
    .sup-tag.delivered { background: var(--color-primary-soft); color: var(--color-primary-dark); }
    /* − 数 + */
    .stepper { display: flex; align-items: center; flex: 0 0 auto; }
    .stepper button {
      width: 36px; height: 36px; padding: 0; cursor: pointer;
      font-size: 18px; color: var(--color-primary-dark);
      background: var(--color-surface); border: 1px solid var(--color-border);
    }
    .stepper button:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
    .stepper button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    .stepper button:disabled { color: var(--color-border); cursor: default; }
    .stepper .qty {
      width: 40px; height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); background: var(--color-surface);
    }
    .stepper .qty.zero { color: var(--color-text-muted); font-weight: 400; }
    /* 変えたときに下に出る帯 */
    .save-bar {
      position: sticky; bottom: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 -10px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: var(--color-surface); box-shadow: 0 -6px 14px rgba(30, 30, 20, 0.12);
      border-top: 3px solid var(--color-work);
    }
    .save-bar .msg { flex: 1; min-width: 140px; font-size: 13px; font-weight: 700; color: var(--color-work-dark); }
    /* 上の帯に隠れないように(保存のあとなどに上へもどるとき) */
    #houseCard { scroll-margin-top: calc(var(--gtool-h) + 10px); }
    .ctx-bar .ctx-line .sub { font-weight: 400; }
    .ctx-bar .ctx-line .pending { background: var(--color-work); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; }
    .house-sum { font-size: 12px; color: var(--color-text-muted); margin: 0; }

    /* ----- PC ビュー / スマホビュー(施設の入力。幅 600px 以上で切り替えを出す。はじめはスマホ) ----- */
    .view-switch { display: none; }
    @media (min-width: 600px) {
      .view-switch { display: flex; }
      /* スマホビュー: スマホの幅(枠つき)で 1 列に並べる */
      #panel-house.view-phone .house-layout {
        max-width: 410px; margin: 0 auto;
        padding: 34px 10px 24px; background: var(--color-bg);
        border: 10px solid #2b2f2e; border-radius: 44px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
        position: relative;
      }
      #panel-house.view-phone .house-layout::before {
        content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 72px; height: 6px; border-radius: 3px; background: #2b2f2e;
      }
      #panel-house.view-phone .house-layout .card { padding-left: 12px; padding-right: 12px; }
      #panel-house.view-phone .place-grid { grid-template-columns: 1fr; }
      #panel-house.view-phone .save-bar { border-radius: 0 0 var(--radius-md) var(--radius-md); }
    }

    /* ----- 本部の管理 ----- */
    .req-table { width: 100%; border-collapse: collapse; }
    .req-table th, .req-table td { border-bottom: 1px solid var(--color-border); padding: 7px 4px; text-align: left; vertical-align: middle; font-size: 13px; }
    .req-table thead th { font-size: 11px; color: var(--color-text-muted); font-weight: 500; }
    .req-table .place-row th { background: var(--color-surface-alt); font-size: 12px; color: var(--color-primary-dark); padding: 4px 6px; }
    .req-table .qty { text-align: right; font-weight: 700; font-size: 15px; white-space: nowrap; width: 3.5em; }
    .req-table .act { text-align: right; white-space: nowrap; width: 1%; }
    .req-table .houses { font-size: 12px; color: var(--color-text-muted); }
    .req-table .date { font-size: 11px; color: var(--color-text-muted); white-space: nowrap; width: 1%; }
    .req-table .st-cell { white-space: nowrap; width: 1%; }
    .req-table .act .btn + .btn { margin-left: 4px; }
    .status-chips button .n { margin-left: 4px; font-size: 11px; opacity: 0.8; }
    /* 在庫の一覧(備品 × 施設) */
    .stock-table { width: 100%; min-width: 560px; border-collapse: collapse; }
    .stock-table th, .stock-table td { border-bottom: 1px solid var(--color-border); padding: 6px 4px; text-align: center; font-size: 13px; }
    .stock-table thead th { font-size: 11px; color: var(--color-text-muted); font-weight: 500; vertical-align: bottom; }
    .stock-table th.name { position: sticky; left: 0; z-index: 1; background: var(--color-surface); text-align: left; font-weight: 500; color: var(--color-text); min-width: 120px; }
    .stock-table th.name small { font-size: 10px; color: var(--color-text-muted); margin-left: 3px; }
    .stock-table .place-row th { background: var(--color-surface-alt); font-size: 12px; color: var(--color-primary-dark); text-align: left; padding: 4px 6px; }
    .stock-table td.min { color: var(--color-text-muted); }
    .stock-table td .stock-low, .stock-table td .stock-near, .stock-table td .stock-ok {
      display: inline-block; min-width: 34px; padding: 2px 6px; border-radius: 999px; border: 1px solid transparent; font-weight: 700;
    }
    .stock-table td .stock-ok { background: none; border-color: transparent; }
    .stock-table tfoot th, .stock-table tfoot td { border-bottom: none; border-top: 2px solid var(--color-border); font-size: 12px; }
    .stock-table tfoot .low { color: var(--color-danger); font-weight: 700; }
    #itemTable { min-width: 620px; }
    #itemTable .col-min { width: 80px; }
    #itemTable .col-place { width: 22%; }
    #itemTable .col-spec { width: 20%; }
    #itemTable tr.inactive input { color: var(--color-text-muted); background: var(--color-surface-alt); }
  </style>
</head>
<body>

<nav id="gtoolBar"></nav>

<div id="loadingScreen" class="loading-screen">
  <i class="ti ti-loader-2 spin"></i>
  <div>確認しています...</div>
</div>

<div id="mainContent" hidden>
  <div class="wrap wide">
    <div class="page-header">
      <h1>
        <span class="page-icon"><i class="ti ti-package"></i></span>
        備品管理
      </h1>
      <p>施設の在庫を見て、使ったら「使った」を押します。足りないものは本部に発注し、本部は全施設の在庫を見て手配します</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-panel="panel-house"><i class="ti ti-home"></i>施設の入力</button>
      <button type="button" class="tab-btn" data-panel="panel-hq"><i class="ti ti-building"></i>本部の管理</button>
    </div>

    <!-- 施設の入力 -->
    <div id="panel-house" class="tab-panel active">
      <!-- PC ビュー / スマホビュー(PC で見るときに切り替える) -->
      <div class="mode-switch view-switch" id="viewSwitch" role="group" aria-label="表示の切り替え">
        <button type="button" data-view="pc"><i class="ti ti-device-desktop"></i>PC</button>
        <button type="button" data-view="phone"><i class="ti ti-device-mobile"></i>スマホ</button>
      </div>
      <div class="house-layout">
      <div class="card" id="houseCard">
        <h2><i class="ti ti-building-community"></i><span id="houseTitle">施設</span></h2>
        <div class="chips" id="houseChips"></div>
        <p class="house-sum" id="houseSum"></p>
        <div class="mode-switch" id="houseFilter" role="group" aria-label="表示する備品" style="margin:12px 0 0;">
          <button type="button" data-filter="all" class="active"><i class="ti ti-list"></i>すべて</button>
          <button type="button" data-filter="low"><i class="ti ti-alert-triangle"></i>足りないものだけ</button>
        </div>
        <div id="houseStatus" class="status-msg"></div>
      </div>
      <div class="place-grid" id="houseItems"></div>
      <div class="toast" id="toast" hidden role="status">
        <span id="toastMsg"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="toastUndo"><i class="ti ti-arrow-back-up"></i>取り消す</button>
      </div>
      <div class="save-bar" id="saveBar" hidden>
        <span class="msg" id="saveMsg"></span>
        <button type="button" class="btn btn-ghost" id="resetBtn"><i class="ti ti-arrow-back-up"></i>もとにもどす</button>
        <button type="button" class="btn" id="saveBtn"><i class="ti ti-send"></i>本部に発注する</button>
      </div>
      </div><!-- /.house-layout -->
    </div>
    <!-- いま入力している施設(施設のカードが上に隠れたら出す。押すと上へ) -->
    <button type="button" class="ctx-bar working" id="ctxBar" aria-label="施設を変える(上へもどる)"><div class="inner" id="ctxBarInner"></div></button>

    <!-- 本部の管理 -->
    <div id="panel-hq" class="tab-panel">
      <div class="mode-switch" id="hqSwitch" role="group" aria-label="本部の管理の切り替え">
        <button type="button" data-mode="stocks" class="active"><i class="ti ti-packages"></i>在庫の一覧</button>
        <button type="button" data-mode="requests"><i class="ti ti-clipboard-list"></i>受注一覧</button>
        <button type="button" data-mode="items"><i class="ti ti-list-details"></i>備品リスト</button>
      </div>

      <div id="hqStocks">
        <div class="card">
          <h2><i class="ti ti-packages"></i>全施設の在庫</h2>
          <div class="chips" id="stockFilter">
            <button type="button" data-filter="all" class="active">すべて</button>
            <button type="button" data-filter="low"><i class="ti ti-alert-triangle"></i> 足りないものがある備品だけ</button>
          </div>
          <p class="sup-help stock-keys"><span class="stock-key stock-low">3</span>最低ストックより少ない
            <span class="stock-key stock-near">3</span>ちょうど最低ストック</p>
          <div class="table-scroll"><table class="stock-table" id="stockTable"></table></div>
        </div>
      </div>

      <div id="hqRequests" hidden>
        <div class="card">
          <div class="chips status-chips" id="statusChips"></div>
          <div id="hqStatus" class="status-msg"></div>
          <h2><i class="ti ti-sum"></i><span id="sumTitle">まとめ</span></h2>
          <div class="table-scroll"><table class="req-table" id="sumTable"></table></div>
        </div>
        <div id="hqHouseCards"></div>
      </div>

      <div id="hqItems" hidden>
        <form id="addForm" class="card" novalidate>
          <h2><i class="ti ti-plus"></i>備品を足す</h2>
          <datalist id="placeList"></datalist>
          <div class="add-row">
            <div class="field">
              <label for="newPlace">使用場所 *</label>
              <input type="text" id="newPlace" list="placeList" required>
            </div>
            <div class="field">
              <label for="newName">商品名 *</label>
              <input type="text" id="newName" required>
            </div>
            <div class="field">
              <label for="newSpec">種類・メモ</label>
              <input type="text" id="newSpec" placeholder="チューブ・缶詰 など">
            </div>
            <div class="field narrow">
              <label for="newMin">最低ストック</label>
              <input type="number" id="newMin" min="0" max="999" value="1" inputmode="numeric">
            </div>
            <button type="submit" id="addBtn" class="btn"><i class="ti ti-plus"></i>足す</button>
          </div>
          <div id="addStatus" class="status-msg"></div>
        </form>

        <div class="card">
          <h2><i class="ti ti-list-details"></i>備品リスト</h2>
          <p class="muted text-sm" style="margin-top:0;">直した内容はすぐに保存されます。最低ストックより在庫が少ないと「足りない」になります。使わなくなった備品は「やめる」で施設の入力から外れます</p>
          <div class="table-scroll">
            <table class="compact-table" id="itemTable">
              <thead>
                <tr>
                  <th class="col-place">使用場所</th>
                  <th>商品名</th>
                  <th class="col-spec">種類・メモ</th>
                  <th class="col-min">最低ストック</th>
                  <th class="col-center"></th>
                </tr>
              </thead>
              <tbody id="itemRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
  const $ = function (id) { return document.getElementById(id); };
  const esc = App.escapeHtml;

  const HOUSE_KEY = 'gh_supplies_house';
  const TAB_KEY = 'gh_supplies_tab';
  // 届けたものは 2 週間分だけ出す
  const DELIVERED_DAYS = 14;

  // 使用場所のアイコン(ないものは箱)
  const PLACE_ICONS = {
    'キッチン': 'ti-tools-kitchen-2', 'おふろ': 'ti-bath', 'トイレ': 'ti-toilet-paper', 'リビング': 'ti-sofa',
    'オフィス': 'ti-briefcase', 'その他': 'ti-dots-circle-horizontal', '調味料・食品': 'ti-salt',
    '洗面所': 'ti-droplet', '洗濯': 'ti-wash-machine', '衛生': 'ti-first-aid-kit', 'ゴミ': 'ti-trash',
  };
  const STATUS = {
    requested: { label: '受注', next: 'ordered', nextLabel: '手配した', icon: 'ti-truck' },
    ordered:   { label: '手配済み', next: 'delivered', nextLabel: '届けた', icon: 'ti-circle-check' },
    delivered: { label: '届けた', back: 'ordered' },
  };

  let houses = [];
  let items = [];
  let requests = [];
  let stocks = {};        // 在庫 { 'house_id|item_id': 数 }
  let usages = [];        // きょうの「使った」の記録
  let house = null;       // 施設の入力で選んでいる施設の id
  let draft = {};         // 施設の入力で変えた数 { item_id: 数 }
  let houseFilter = 'all';
  let hqMode = 'stocks';
  // 受注一覧の表示: open = 受注と手配済み(いっしょに管理する)/ delivered = 届けた
  const VIEWS = {
    open:      { label: '受注・手配済み', statuses: ['requested', 'ordered'] },
    delivered: { label: '届けた(2週間)', statuses: ['delivered'] },
  };
  let hqStatus = 'open';
  let stockFilter = 'all';
  let lastUse = null;     // 取り消せる最後の「使った」

  function activeHouses() { return houses.filter(function (h) { return h.is_active; }); }
  function houseName(id) { const h = houses.find(function (x) { return x.id === id; }); return h ? h.name : '(不明な施設)'; }
  function itemOf(id) { return items.find(function (x) { return x.id === id; }); }
  function placeIcon(p) { return PLACE_ICONS[p] || 'ti-box'; }
  function itemLabel(it) {
    return esc(it.name) + (it.spec ? '<small>' + esc(it.spec) + '</small>' : '');
  }
  // 「10/31」(日本時間)
  function md(ts) {
    return ts ? new Date(ts).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric' }) : '';
  }

  // 使用場所ごとにまとめる(リストの並び順。使用場所の順は最初に出てきた順)
  function groupByPlace(list) {
    const out = [], at = {};
    list.forEach(function (it) {
      if (!(it.place in at)) { at[it.place] = out.length; out.push({ place: it.place, items: [] }); }
      out[at[it.place]].items.push(it);
    });
    return out;
  }

  // ----- 在庫 -----
  function stockKey(hid, iid) { return hid + '|' + iid; }
  function stockOf(hid, iid) { return stocks[stockKey(hid, iid)] || 0; }
  // low = 最低ストックより少ない / near = ちょうど最低ストック / ok = 足りている
  function stockLevel(q, it) {
    if (q < it.min_stock) return 'low';
    if (it.min_stock > 0 && q === it.min_stock) return 'near';
    return 'ok';
  }
  function isLow(hid, it) { return stockOf(hid, it.id) < it.min_stock; }

  async function loadAll() {
    const r = await Promise.all([
      App.rpc('get_houses'),
      App.rpc('get_supply_items'),
      App.rpc('get_supply_requests', { p_since: App.todayJST(-DELIVERED_DAYS) }),
      App.rpc('get_supply_stocks'),
      App.rpc('get_supply_usages', { p_since: App.todayJST() }),
    ]);
    houses = r[0]; items = r[1]; requests = r[2];
    stocks = {};
    r[3].forEach(function (s) { stocks[stockKey(s.house_id, s.item_id)] = s.quantity; });
    usages = r[4];
  }
  async function reload() {
    await loadAll();
    renderAll();
  }
  function renderAll() {
    renderHouse();
    renderHq();
  }

  // ===== 施設の入力 =====
  function requestsOf(hid, iid, status) {
    return requests.filter(function (q) { return q.house_id === hid && q.item_id === iid && q.status === status; });
  }
  // 発注中(本部では受注)の数
  function savedQty(iid) {
    const q = requestsOf(house, iid, 'requested')[0];
    return q ? q.quantity : 0;
  }
  function qtyOf(iid) { return iid in draft ? draft[iid] : savedQty(iid); }
  function changedIds() { return Object.keys(draft).filter(function (id) { return draft[id] !== savedQty(id); }); }

  function renderHouse() {
    const hs = activeHouses();
    if (!hs.some(function (h) { return h.id === house; })) house = hs.length ? hs[0].id : null;
    renderCtx();
    $('houseChips').innerHTML = hs.map(function (h) {
      return '<button type="button" data-house="' + esc(h.id) + '"' + (h.id === house ? ' class="active"' : '') + '>' + esc(h.name) + '</button>';
    }).join('');
    if (!house) {
      $('houseSum').textContent = '';
      $('houseItems').innerHTML = '<div class="card"><div class="empty-msg">施設が登録されていません</div></div>';
      renderSaveBar();
      return;
    }
    const active = items.filter(function (it) { return it.is_active; });
    renderHouseSum();
    $('houseFilter').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.filter === houseFilter); });

    const shown = houseFilter === 'low' ? active.filter(function (it) { return isLow(house, it); }) : active;
    const help = '<p class="sup-help">在庫のチップを押すと数を直せます。「使った」で 1 つ減ります。「発注」の + − は本部に発注する数です</p>';
    $('houseItems').innerHTML = groupByPlace(shown).map(function (g) {
      return '<div class="card"><h2><i class="ti ' + placeIcon(g.place) + '"></i>' + esc(g.place) + '</h2>' + help + '<ul class="sup-list">' +
        g.items.map(houseRow).join('') + '</ul></div>';
    }).join('') || '<div class="card"><div class="empty-msg">' +
      (active.length ? '最低ストックより少ない備品はありません' : '備品リストが空です。「本部の管理」の「備品リスト」で足してください') + '</div></div>';
    renderSaveBar();
  }

  function houseRow(it) {
    const q = qtyOf(it.id);
    const changed = q !== savedQty(it.id);
    const stock = stockOf(house, it.id);
    const used = usages.filter(function (u) { return u.house_id === house && u.item_id === it.id; }).length;
    const tags = [];
    if (savedQty(it.id)) tags.push('<span class="sup-tag requested">発注中 ' + savedQty(it.id) + '</span>');
    requestsOf(house, it.id, 'ordered').forEach(function (r) { tags.push('<span class="sup-tag ordered">手配済み ' + r.quantity + '</span>'); });
    requestsOf(house, it.id, 'delivered').forEach(function (r) { tags.push('<span class="sup-tag delivered">' + md(r.delivered_at) + ' 届いた ' + r.quantity + '</span>'); });
    if (used) tags.push('<span class="sup-tag ordered">きょう ' + used + ' 回使った</span>');
    return '<li class="sup-row' + (changed ? ' changed' : '') + '" data-row="' + esc(it.id) + '">' +
      '<div class="sup-name">' + itemLabel(it) + (tags.length ? '<div class="sup-tags">' + tags.join('') + '</div>' : '') + '</div>' +
      '<div class="sup-ctrl">' +
      '<button type="button" class="stock-chip stock-' + stockLevel(stock, it) + '" data-stock="' + esc(it.id) + '" title="押すと在庫の数を直せます" aria-label="' + esc(it.name) + ' 在庫 ' + stock + '。押すと数を直せます">' +
        '在庫 ' + stock + '<small>最低 ' + it.min_stock + '</small></button>' +
      '<button type="button" class="btn btn-ghost btn-sm use-btn" data-use="' + esc(it.id) + '"' + (stock ? '' : ' disabled') + '><i class="ti ti-hand-finger"></i>使った</button>' +
      '<div class="order"><span class="order-label">発注</span><div class="stepper">' +
        '<button type="button" data-item="' + esc(it.id) + '" data-step="-1"' + (q ? '' : ' disabled') + ' aria-label="' + esc(it.name) + 'を 1 つ減らす"><i class="ti ti-minus"></i></button>' +
        '<span class="qty' + (q ? '' : ' zero') + '">' + q + '</span>' +
        '<button type="button" data-item="' + esc(it.id) + '" data-step="1" aria-label="' + esc(it.name) + 'を 1 つ増やす"><i class="ti ti-plus"></i></button>' +
      '</div></div></div></li>';
  }
  function rerenderRow(iid) {
    const li = $('houseItems').querySelector('[data-row="' + iid + '"]');
    if (li) li.outerHTML = houseRow(itemOf(iid));
  }

  // 「使った」: 在庫を 1 減らし、記録を残す。下の知らせから取り消せる
  async function onUse(b) {
    const iid = b.dataset.use, hid = house, it = itemOf(iid);
    const k = stockKey(hid, iid);
    b.disabled = true;
    App.setStatus($('houseStatus'), '');
    try {
      const row = await App.rpc('use_supply', { p_house_id: hid, p_item_id: iid });
      stocks[k] = Math.max(0, stockOf(hid, iid) - 1);
      usages.push(row);
      lastUse = row;
      showToast(it.name + ' を 1 つ使いました(在庫 ' + stocks[k] + ')');
    } catch (err) {
      console.error(err);
      App.setStatus($('houseStatus'), /在庫が 0/.test(err.message) ? '在庫が 0 です。在庫のチップを押して数を直してください' : '記録できませんでした。通信状況を確認してください', 'err');
    }
    if (hid === house) { rerenderRow(iid); renderHouseSum(); }
  }

  let toastTimer = null;
  function showToast(msg) {
    $('toastMsg').textContent = msg;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').hidden = true; lastUse = null; }, 6000);
  }
  async function onUndoUse() {
    const u = lastUse;
    if (!u) return;
    $('toast').hidden = true;
    lastUse = null;
    try {
      await App.rpc('void_supply_usage', { p_id: u.id });
      stocks[stockKey(u.house_id, u.item_id)] = stockOf(u.house_id, u.item_id) + u.quantity;
      usages = usages.filter(function (x) { return x.id !== u.id; });
    } catch (err) {
      console.error(err);
      App.setStatus($('houseStatus'), '取り消せませんでした。通信状況を確認してください', 'err');
    }
    if (u.house_id === house) { rerenderRow(u.item_id); renderHouseSum(); }
  }

  // 在庫のチップ: 数を数えて直す
  async function onStock(b) {
    const iid = b.dataset.stock, it = itemOf(iid);
    const before = stockOf(house, iid);
    const s = prompt(it.name + ' はいくつありますか?(数えた数を入れてください)', String(before));
    if (s == null) return;
    const v = s.trim().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (!/^\d{1,4}$/.test(v)) { alert('0〜9999 の数で入れてください'); return; }
    const hid = house;
    try {
      await App.rpc('set_supply_stock', { p_house_id: hid, p_item_id: iid, p_quantity: Number(v) });
      stocks[stockKey(hid, iid)] = Number(v);
      App.setStatus($('houseStatus'), it.name + ' の在庫を ' + v + ' にしました', 'ok');
    } catch (err) {
      console.error(err);
      App.setStatus($('houseStatus'), '直せませんでした。通信状況を確認してください', 'err');
    }
    if (hid === house) { rerenderRow(iid); renderHouseSum(); }
  }

  // 上の「足りない n 品」だけ描き直す(行は描き直さない)
  function renderHouseSum() {
    const mine = requests.filter(function (q) { return q.house_id === house; });
    const n = function (s) { return mine.filter(function (q) { return q.status === s; }).length; };
    const lows = items.filter(function (it) { return it.is_active && isLow(house, it); }).length;
    $('houseSum').innerHTML = (lows ? '<span class="low">最低ストックより少ない ' + lows + ' 品</span>' : '足りない備品はありません') +
      '・発注中 ' + n('requested') + ' 品・手配済み ' + n('ordered') + ' 品・届いた(2週間) ' + n('delivered') + ' 品';
  }

  function renderSaveBar() {
    const ids = changedIds();
    $('saveBar').hidden = !ids.length;
    $('saveMsg').textContent = (house ? houseName(house) + ': ' : '') + ids.length + ' 品を変えました(まだ送っていません)';
    renderCtx();
  }

  // ===== いま入力している施設(カードの見出しと上の帯) =====
  // 日々の記録と同じく、下にスクロールしても、どの施設の入力かがいつも見えるようにする
  function renderCtx() {
    $('houseCard').classList.toggle('card-picked', !!house);
    $('houseTitle').textContent = house ? houseName(house) : '施設';
    const n = changedIds().length;
    $('ctxBarInner').innerHTML = house
      ? '<div class="ctx-line"><i class="ti ti-building-community"></i>' + esc(houseName(house)) +
        '<span class="sep">・</span><span class="sub">備品の在庫と発注</span>' +
        (n ? '<span class="pending">発注 ' + n + ' 品 まだ送っていません</span>' : '') + '</div>'
      : '';
    updateCtxBar();
  }
  // 施設のカードが画面の上に隠れたら、上の帯を出す(施設の入力のタブのときだけ)
  let houseCardHidden = false;
  function updateCtxBar() {
    const on = houseCardHidden && !!house && $('panel-house').classList.contains('active');
    $('ctxBar').classList.toggle('show', on);
  }
  function watchHouseCard() {
    if (!('IntersectionObserver' in window)) return;
    const gtoolH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gtool-h'), 10) || 46;
    new IntersectionObserver(function (entries) {
      const e = entries[0];
      // タブを切り替えて見えなくなったときは「隠れた」としない
      houseCardHidden = !e.isIntersecting && e.boundingClientRect.bottom <= gtoolH && e.boundingClientRect.height > 0;
      updateCtxBar();
    }, { rootMargin: '-' + gtoolH + 'px 0px 0px 0px' }).observe($('houseCard'));
  }

  function onHouseClick(e) {
    const use = e.target.closest('button[data-use]');
    if (use) return onUse(use);
    const st = e.target.closest('button[data-stock]');
    if (st) return onStock(st);
    const b = e.target.closest('button[data-step]');
    if (!b) return;
    const id = b.dataset.item;
    draft[id] = Math.max(0, Math.min(999, qtyOf(id) + Number(b.dataset.step)));
    // その行だけ描き直す(スマホで軽く)
    rerenderRow(id);
    renderSaveBar();
  }

  async function onSave() {
    const ids = changedIds();
    if (!ids.length) return;
    const btn = $('saveBtn');
    btn.disabled = true;
    App.setStatus($('houseStatus'), '');
    try {
      await App.rpc('save_supply_requests', {
        p_house_id: house,
        p_items: ids.map(function (id) { return { item_id: id, quantity: draft[id] }; }),
      });
      draft = {};
      await reload();
      App.setStatus($('houseStatus'), houseName(house) + 'の発注を本部に送りました', 'ok');
    } catch (err) {
      console.error(err);
      App.setStatus($('houseStatus'), '送れませんでした。通信状況を確認してください', 'err');
      $('saveBar').scrollIntoView({ block: 'nearest' });
    } finally {
      btn.disabled = false;
    }
  }

  function confirmDiscard() {
    return !changedIds().length || confirm('送っていない変更があります。変更をやめて切り替えますか?');
  }

  // ===== 本部の管理 =====
  function renderHq() {
    $('hqSwitch').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.mode === hqMode); });
    $('hqStocks').hidden = hqMode !== 'stocks';
    $('hqRequests').hidden = hqMode !== 'requests';
    $('hqItems').hidden = hqMode !== 'items';
    if (hqMode === 'stocks') renderStocks();
    else if (hqMode === 'requests') renderRequests();
    else renderItems();
  }

  // 在庫の一覧: 備品 × 施設。最低ストックより少ないものは赤
  function renderStocks() {
    $('stockFilter').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.dataset.filter === stockFilter); });
    const hs = activeHouses();
    const active = items.filter(function (it) { return it.is_active; });
    if (!hs.length || !active.length) {
      $('stockTable').innerHTML = '<tr><td class="empty-msg">' + (hs.length ? '備品リストが空です' : '施設が登録されていません') + '</td></tr>';
      return;
    }
    const shown = stockFilter === 'low'
      ? active.filter(function (it) { return hs.some(function (h) { return isLow(h.id, it); }); })
      : active;
    const cols = hs.length + 3;
    let t = '<thead><tr><th class="name">備品</th><th>最低</th>' +
      hs.map(function (h) { return '<th>' + esc(h.name) + '</th>'; }).join('') + '<th>合計</th></tr></thead><tbody>';
    groupByPlace(shown).forEach(function (g) {
      t += '<tr class="place-row"><th colspan="' + cols + '"><i class="ti ' + placeIcon(g.place) + '"></i> ' + esc(g.place) + '</th></tr>';
      g.items.forEach(function (it) {
        let total = 0;
        t += '<tr><th class="name">' + itemLabel(it) + '</th><td class="min">' + it.min_stock + '</td>' +
          hs.map(function (h) {
            const q = stockOf(h.id, it.id);
            total += q;
            return '<td><span class="stock-' + stockLevel(q, it) + '">' + q + '</span></td>';
          }).join('') + '<td>' + total + '</td></tr>';
      });
    });
    if (!shown.length) t += '<tr><td colspan="' + cols + '" class="empty-msg">最低ストックより少ない備品はありません</td></tr>';
    // 施設ごとの「足りない品数」
    t += '</tbody><tfoot><tr><th class="name">足りない品数</th><td></td>' + hs.map(function (h) {
      const n = active.filter(function (it) { return isLow(h.id, it); }).length;
      return '<td' + (n ? ' class="low"' : '') + '>' + n + ' 品</td>';
    }).join('') + '<td></td></tr></tfoot>';
    $('stockTable').innerHTML = t;
  }

  function renderRequests() {
    $('statusChips').innerHTML = Object.keys(VIEWS).map(function (v) {
      const n = requests.filter(function (q) { return VIEWS[v].statuses.indexOf(q.status) >= 0; }).length;
      return '<button type="button" data-status="' + v + '"' + (v === hqStatus ? ' class="active"' : '') + '>' +
        VIEWS[v].label + '<span class="n">' + n + '</span></button>';
    }).join('');
    const view = VIEWS[hqStatus];
    const list = requests.filter(function (q) { return view.statuses.indexOf(q.status) >= 0; });
    $('sumTitle').textContent = 'まとめ(' + view.label + '・全施設)';

    // まとめ: 備品ごとの合計(備品リストの順)。受注と手配済みは分けて数え、それぞれまとめて進められる
    const byItem = {};
    list.forEach(function (q) { (byItem[q.item_id] = byItem[q.item_id] || []).push(q); });
    const its = items.filter(function (it) { return byItem[it.id]; });
    if (!its.length) {
      $('sumTable').innerHTML = '<tr><td class="empty-msg">' + view.label + 'の備品はありません</td></tr>';
    } else {
      let t = '<thead><tr><th>商品</th><th class="qty">合計</th><th>施設ごと</th><th class="act"></th></tr></thead><tbody>';
      groupByPlace(its).forEach(function (g) {
        t += '<tr class="place-row"><th colspan="4"><i class="ti ' + placeIcon(g.place) + '"></i> ' + esc(g.place) + '</th></tr>';
        g.items.forEach(function (it) {
          const qs = byItem[it.id];
          const total = qs.reduce(function (a, q) { return a + q.quantity; }, 0);
          t += '<tr><td>' + itemLabel(it) + '</td><td class="qty">' + total + '</td>' +
            '<td class="houses">' + qs.map(function (q) {
              return esc(houseName(q.house_id)) + ' ' + q.quantity + (view.statuses.length > 1 ? statusTag(q.status) : '');
            }).join('・') + '</td>' +
            '<td class="act">' + view.statuses.map(function (s) {
              const ids = qs.filter(function (q) { return q.status === s; }).map(function (q) { return q.id; });
              return ids.length ? actionButtons(ids, true, s) : '';
            }).join('') + '</td></tr>';
        });
      });
      $('sumTable').innerHTML = t + '</tbody>';
    }

    // 施設ごと。受注 → 手配済み の順、同じ状態の中は備品リストの順
    const WHEN = { requested: 'requested_at', ordered: 'ordered_at', delivered: 'delivered_at' };
    const hids = houses.map(function (h) { return h.id; }).filter(function (id) { return list.some(function (q) { return q.house_id === id; }); });
    $('hqHouseCards').innerHTML = hids.map(function (hid) {
      const qs = list.filter(function (q) { return q.house_id === hid; });
      const order = function (q) { const it = itemOf(q.item_id); return it ? it.sort_order : 0; };
      qs.sort(function (a, b) { return view.statuses.indexOf(a.status) - view.statuses.indexOf(b.status) || order(a) - order(b); });
      return '<div class="card"><h2><i class="ti ti-building-community"></i>' + esc(houseName(hid)) + '</h2>' +
        '<div class="table-scroll"><table class="req-table"><tbody>' + qs.map(function (q) {
          const it = itemOf(q.item_id);
          return '<tr><td>' + (it ? itemLabel(it) : '') + (it ? '<div class="houses">' + esc(it.place) + '</div>' : '') + '</td>' +
            (view.statuses.length > 1 ? '<td class="st-cell">' + statusTag(q.status) + '</td>' : '') +
            '<td class="qty">' + q.quantity + '</td><td class="date">' + md(q[WHEN[q.status]]) + '</td>' +
            '<td class="act">' + actionButtons([q.id], false, q.status) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }).join('');
  }

  function statusTag(status) {
    return '<span class="sup-tag ' + status + '">' + STATUS[status].label + '</span>';
  }

  // 次へ進めるボタン(届けたは「もどす」)。施設ごとの行には取消も付ける
  function actionButtons(ids, all, status) {
    const st = STATUS[status];
    const data = ' data-ids="' + esc(ids.join(',')) + '"';
    if (st.next) {
      return '<button type="button" class="btn btn-sm"' + data + ' data-to="' + st.next + '"><i class="ti ' + st.icon + '"></i>' +
        (all && ids.length > 1 ? 'まとめて' : '') + st.nextLabel + '</button>' +
        (all ? '' : ' <button type="button" class="icon-btn danger" data-void="' + esc(ids[0]) + '" title="取り消す" aria-label="取り消す"><i class="ti ti-trash"></i></button>');
    }
    return all ? '' : '<button type="button" class="btn btn-ghost btn-sm"' + data + ' data-to="' + st.back + '"><i class="ti ti-arrow-back-up"></i>もどす</button>';
  }

  async function onRequestAction(e) {
    const b = e.target.closest('button[data-to], button[data-void]');
    if (!b) return;
    App.setStatus($('hqStatus'), '');
    b.disabled = true;
    try {
      if (b.dataset.void) {
        if (!confirm('この受注を取り消しますか?')) { b.disabled = false; return; }
        await App.rpc('void_supply_request', { p_id: b.dataset.void });
      } else {
        await App.rpc('set_supply_request_status', { p_ids: b.dataset.ids.split(','), p_status: b.dataset.to });
      }
      await reload();
    } catch (err) {
      console.error(err);
      b.disabled = false;
      App.setStatus($('hqStatus'), '変えられませんでした。通信状況を確認してください', 'err');
    }
  }

  // ----- 備品リスト -----
  function renderItems() {
    const places = groupByPlace(items).map(function (g) { return g.place; });
    $('placeList').innerHTML = places.map(function (p) { return '<option value="' + esc(p) + '">'; }).join('');
    // 使っている備品を上に、やめた備品は下にまとめる
    const rows = items.filter(function (it) { return it.is_active; }).concat(items.filter(function (it) { return !it.is_active; }));
    $('itemRows').innerHTML = rows.map(function (it) {
      return '<tr data-id="' + esc(it.id) + '"' + (it.is_active ? '' : ' class="inactive"') + '>' +
        '<td><input type="text" class="autosave" data-field="place" list="placeList" value="' + esc(it.place) + '"></td>' +
        '<td><input type="text" class="autosave" data-field="name" value="' + esc(it.name) + '"></td>' +
        '<td><input type="text" class="autosave" data-field="spec" value="' + esc(it.spec) + '"></td>' +
        '<td><input type="number" class="autosave" data-field="min_stock" min="0" max="999" inputmode="numeric" value="' + esc(it.min_stock) + '"></td>' +
        '<td class="col-center">' + (it.is_active
          ? '<button type="button" class="btn btn-ghost btn-sm" data-active="false"><i class="ti ti-player-pause"></i>やめる</button>'
          : '<button type="button" class="btn btn-sm" data-active="true"><i class="ti ti-player-play"></i>また使う</button>') + '</td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="5" class="empty-msg">まだ備品がありません</td></tr>';
  }

  async function onItemChange(e) {
    const input = e.target;
    const field = input.dataset.field;
    const tr = input.closest('tr');
    if (!field || !tr) return;
    const it = itemOf(tr.dataset.id);
    const value = input.value.trim();
    if (field !== 'spec' && !value) {
      alert({ place: '使用場所', name: '商品名', min_stock: '最低ストック' }[field] + 'は空にできません');
      input.value = it ? it[field] : '';
      return;
    }
    if (field === 'min_stock' && !/^\d{1,3}$/.test(value)) {
      alert('最低ストックは 0〜999 の数で入れてください');
      input.value = it ? it.min_stock : '';
      return;
    }
    try {
      await App.rpc('update_supply_item_field', { p_id: tr.dataset.id, p_field: field, p_value: value || null });
    } catch (err) {
      console.error(err);
      App.flashSaved(input, false);
      return;
    }
    if (it) it[field] = field === 'min_stock' ? Number(value) : (value || null);
    App.flashSaved(input, true);
    if (field !== 'spec') renderHouse();
  }

  async function onItemActive(e) {
    const b = e.target.closest('button[data-active]');
    if (!b) return;
    const it = itemOf(b.closest('tr').dataset.id);
    if (b.dataset.active === 'false' && !confirm(it.name + ' をやめますか?(施設の入力に出なくなります。あとで「また使う」でもどせます)')) return;
    b.disabled = true;
    try {
      await App.rpc('set_supply_item_active', { p_id: it.id, p_active: b.dataset.active === 'true' });
      await reload();
    } catch (err) {
      console.error(err);
      b.disabled = false;
      alert('変えられませんでした。通信状況を確認してください');
    }
  }

  async function onAdd(e) {
    e.preventDefault();
    const status = $('addStatus');
    const place = $('newPlace').value.trim(), name = $('newName').value.trim();
    const min = $('newMin').value.trim() || '1';
    if (!place || !name) { App.setStatus(status, '使用場所と商品名を入れてください', 'err'); return; }
    if (!/^\d{1,3}$/.test(min)) { App.setStatus(status, '最低ストックは 0〜999 の数で入れてください', 'err'); return; }
    const btn = $('addBtn');
    btn.disabled = true;
    try {
      const row = await App.rpc('add_supply_item', { p_place: place, p_name: name, p_spec: $('newSpec').value.trim() || null });
      if (Number(min) !== row.min_stock) {
        await App.rpc('update_supply_item_field', { p_id: row.id, p_field: 'min_stock', p_value: min });
      }
    } catch (err) {
      console.error(err);
      App.setStatus(status, '足せませんでした', 'err');
      return;
    } finally {
      btn.disabled = false;
    }
    $('newName').value = ''; $('newSpec').value = '';
    $('newName').focus();
    App.setStatus(status, place + 'に ' + name + ' を足しました', 'ok');
    await reload();
  }

  // ===== PC ビュー / スマホビュー(施設の入力はスマホで使うことが多いので、はじめはスマホ) =====
  const VIEW_KEY = 'gh_supplies_view';
  function setView(v) {
    const view = v === 'pc' ? 'pc' : 'phone';
    $('panel-house').classList.toggle('view-phone', view === 'phone');
    $('viewSwitch').querySelectorAll('button').forEach(function (b) {
      const on = b.dataset.view === view;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) { /* noop */ }
  }

  // ===== タブ =====
  function showTab(panel) {
    document.querySelectorAll('.tab-btn').forEach(function (x) { x.classList.toggle('active', x.dataset.panel === panel); });
    document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.toggle('active', p.id === panel); });
    try { localStorage.setItem(TAB_KEY, panel); } catch (e) { /* noop */ }
    updateCtxBar();
  }

  App.boot({
    active: 'supplies',
    onReady: async function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) {
        b.addEventListener('click', function () { showTab(b.dataset.panel); });
      });
      let v0 = 'phone';
      try { v0 = localStorage.getItem(VIEW_KEY) || 'phone'; } catch (e) { /* noop */ }
      setView(v0);
      $('viewSwitch').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-view]');
        if (b) setView(b.dataset.view);
      });
      $('houseChips').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-house]');
        if (!b || b.dataset.house === house || !confirmDiscard()) return;
        house = b.dataset.house;
        draft = {};
        try { localStorage.setItem(HOUSE_KEY, house); } catch (e2) { /* noop */ }
        App.setStatus($('houseStatus'), '');
        renderHouse();
      });
      $('houseItems').addEventListener('click', onHouseClick);
      $('ctxBar').addEventListener('click', function () { $('houseCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      watchHouseCard();
      $('toastUndo').addEventListener('click', onUndoUse);
      $('houseFilter').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-filter]');
        if (!b) return;
        houseFilter = b.dataset.filter;
        renderHouse();
      });
      $('stockFilter').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-filter]');
        if (!b) return;
        stockFilter = b.dataset.filter;
        renderStocks();
      });
      $('saveBtn').addEventListener('click', onSave);
      $('resetBtn').addEventListener('click', function () { draft = {}; renderHouse(); });
      window.addEventListener('beforeunload', function (e) {
        if (changedIds().length) { e.preventDefault(); e.returnValue = ''; }
      });

      $('hqSwitch').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-mode]');
        if (!b) return;
        hqMode = b.dataset.mode;
        renderHq();
      });
      $('statusChips').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-status]');
        if (!b) return;
        hqStatus = b.dataset.status;
        App.setStatus($('hqStatus'), '');
        renderRequests();
      });
      $('sumTable').addEventListener('click', onRequestAction);
      $('hqHouseCards').addEventListener('click', onRequestAction);
      $('itemRows').addEventListener('change', onItemChange);
      $('itemRows').addEventListener('click', onItemActive);
      $('addForm').addEventListener('submit', onAdd);

      // ?tab=hq で本部の管理を開く。なければ前に開いていたタブ
      const params = new URLSearchParams(location.search);
      let tab = params.get('tab') === 'hq' ? 'panel-hq' : params.get('tab') === 'house' ? 'panel-house' : null;
      try {
        house = localStorage.getItem(HOUSE_KEY);
        if (!tab) tab = localStorage.getItem(TAB_KEY);
      } catch (e) { /* noop */ }
      if (tab === 'panel-hq' || tab === 'panel-house') showTab(tab);

      await loadAll();
      renderAll();
    },
  });
</script>

</body>
</html>
