<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食数管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/common.css">
  <style>
    .date-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .date-row input[type="date"] { width: auto; font-size: 14px; }
    .date-row .date-label { font-size: 15px; font-weight: 700; }
    .date-row .date-label.sat { color: var(--color-sat); }
    .date-row .date-label.sun { color: var(--color-danger); }
    .view-chips { justify-content: center; margin: 12px 0 0; }
    .view-chips button { font-size: 13px; padding: 7px 14px; }
    /* まとめの表のハウス名は、押すとそのハウスへ */
    .house-link { font: inherit; color: var(--color-primary-dark); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-align: left; }

    /* ----- まとめ・ハウスごとの表 ----- */
    .count-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .count-table th, .count-table td { border-bottom: 1px solid var(--color-border); padding: 6px 4px; text-align: center; }
    .count-table thead th { font-size: 12px; color: var(--color-text-muted); }
    .count-table th.name { text-align: left; width: 38%; font-size: 13px; font-weight: 700; color: var(--color-text); }
    .count-table th.name small { display: block; font-size: 10px; font-weight: 400; color: var(--color-text-muted); }
    .count-table tfoot th, .count-table tfoot td { border-bottom: none; border-top: 2px solid var(--color-border); }
    .count-big { font-size: 20px; font-weight: 700; color: var(--color-primary-dark); }
    .count-big small { font-size: 11px; font-weight: 500; margin-left: 1px; }
    .count-sub { display: block; font-size: 10px; color: var(--color-text-muted); white-space: nowrap; }
    .count-none { font-size: 12px; color: var(--color-text-muted); }
    /* 押すと ○ → × → ○ と変えられる */
    .mark-cell {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 36px; cursor: pointer;
      border-radius: var(--radius-sm); border: 1px solid var(--color-border);
      font-family: var(--font-base); font-size: 18px; font-weight: 700;
    }
    .mark-cell.unset { font-size: 11px; }
    .mark-cell:hover { box-shadow: var(--shadow-md); }

    /* 色の説明 */
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 11px; color: var(--color-text-muted); margin: -6px 0 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend .mark-cell { width: 26px; height: 22px; font-size: 13px; cursor: default; }
    .legend .mark-cell:hover { box-shadow: none; }
  </style>
</head>
<body>

<nav id="gtoolBar"></nav>

<div id="loadingScreen" class="loading-screen">
  <i class="ti ti-loader-2 spin"></i>
  <div>確認しています...</div>
</div>

<div id="mainContent" hidden>
  <div class="wrap">
    <div class="page-header">
      <h1>
        <span class="page-icon"><i class="ti ti-tools-kitchen-2"></i></span>
        食数管理
      </h1>
      <p>利用者さんが選んだ「食べる ○・食べない ×」を、ハウスごとに数えます。スタッフも、○ × を押して変えられます</p>
    </div>

    <div class="card">
      <div class="date-row">
        <button type="button" class="btn btn-ghost btn-sm" id="prevDay" aria-label="前の日"><i class="ti ti-chevron-left"></i></button>
        <span class="date-label" id="dateLabel"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="nextDay" aria-label="次の日"><i class="ti ti-chevron-right"></i></button>
        <input type="date" id="dateInput" aria-label="日にち">
        <button type="button" class="btn btn-ghost btn-sm" id="todayBtn">今日</button>
      </div>
      <!-- まとめ・各ハウスを切り替える -->
      <div class="chips view-chips" id="viewChips"></div>
      <div id="loadStatus" class="status-msg center"></div>
    </div>

    <!-- まとめ(ハウス × 食事の ○ の数) -->
    <div class="card" id="sumCard">
      <h2><i class="ti ti-sum"></i>まとめ</h2>
      <table class="count-table" id="sumTable"></table>
    </div>

    <!-- ハウスごと(利用者さんの ○ ×) -->
    <div id="houseCards"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/rooms.js"></script>
<script src="js/meals.js"></script>
<script>
  const $ = function (id) { return document.getElementById(id); };
  const esc = App.escapeHtml;

  let date = App.todayJST();
  let plans = {};
  const VIEW_KEY = 'gh_meals_view';
  let view = 'sum';   // 'sum'(まとめ)か、ハウスの id
  let byWho = {};    // 誰が選んだか(resident / staff)

  // 色の説明(ハウスごとのカードの中に出す)
  const LEGEND = '<div class="legend">' +
    '<span><span class="mark-cell meal-mark eat">○</span><span class="mark-cell meal-mark skip">×</span>利用者さんが選んだ</span>' +
    '<span><span class="mark-cell meal-mark eat by-staff">○</span><span class="mark-cell meal-mark skip by-staff">×</span>スタッフが変えた</span>' +
    '<span><span class="mark-cell meal-mark unset">未</span>まだ選んでいない</span>' +
    '<span>押すと ○ → × → ○ と変わります</span></div>';

  function activeHouses() { return Rooms.houses.filter(function (h) { return h.is_active; }); }

  // その日にハウスの部屋に入居している人(部屋の順)
  function peopleOfHouse(hid) {
    const out = [];
    Rooms.roomsOf(hid, true).forEach(function (room) {
      const a = Rooms.occupantOf(room.id, date);
      const p = a ? Rooms.resident(a.resident_id) : null;
      if (p) out.push({ resident: p, room: room });
    });
    return out;
  }

  // ある人たち・ある食事の ○ × 未 の数
  function countOf(people, meal) {
    const c = { eat: 0, skip: 0, unset: 0 };
    people.forEach(function (x) { c[Meals.markClass(plans[Meals.key(x.resident.id, date, meal)])]++; });
    return c;
  }
  function countCell(c) {
    return '<td><span class="count-big">' + c.eat + '<small>食</small></span>' +
      '<span class="count-sub">× ' + c.skip + '・未 ' + c.unset + '</span></td>';
  }

  function render() {
    $('dateInput').value = date;
    const lbl = $('dateLabel');
    lbl.textContent = Meals.dateLabel(date) + (date === App.todayJST() ? ' きょう' : '');
    lbl.className = 'date-label ' + Meals.dayClass(date);

    const meals = Meals.KINDS.filter(function (k) { return Meals.hasMeal(date, k.key); });
    const head = '<thead><tr><th class="name"></th>' + meals.map(function (k) {
      return '<th><i class="ti ' + k.icon + '"></i> ' + k.label + '</th>';
    }).join('') + '</tr></thead>';

    // まとめ
    const houses = activeHouses().map(function (h) { return { house: h, people: peopleOfHouse(h.id) }; });
    if (view !== 'sum' && !houses.some(function (x) { return x.house.id === view; })) view = 'sum';

    // 切り替えのチップ
    $('viewChips').innerHTML = [{ id: 'sum', name: 'まとめ' }].concat(houses.map(function (x) { return { id: x.house.id, name: x.house.name }; })).map(function (it) {
      return '<button type="button" data-view="' + esc(it.id) + '"' + (it.id === view ? ' class="active"' : '') + '>' +
        (it.id === 'sum' ? '<i class="ti ti-sum"></i> ' : '') + esc(it.name) + '</button>';
    }).join('');
    $('sumCard').hidden = view !== 'sum';
    let sum = head + '<tbody>';
    houses.forEach(function (x) {
      sum += '<tr><th class="name"><button type="button" class="house-link" data-view="' + esc(x.house.id) + '">' + esc(x.house.name) + '</button><small>入居 ' + x.people.length + '人</small></th>' +
        meals.map(function (k) { return countCell(countOf(x.people, k.key)); }).join('') + '</tr>';
    });
    const all = houses.reduce(function (a, x) { return a.concat(x.people); }, []);
    sum += '</tbody><tfoot><tr><th class="name">合計<small>入居 ' + all.length + '人</small></th>' +
      meals.map(function (k) { return countCell(countOf(all, k.key)); }).join('') + '</tr></tfoot>';
    $('sumTable').innerHTML = houses.length ? sum : '<tr><td class="empty-msg">ハウスが登録されていません</td></tr>';

    // 選んだハウスだけ出す
    $('houseCards').innerHTML = houses.filter(function (x) { return x.house.id === view; }).map(function (x) {
      let t = '<div class="card"><h2><i class="ti ti-building-community"></i>' + esc(x.house.name) + '</h2>';
      if (!x.people.length) return t + '<div class="empty-msg">この日に入居している利用者さんはいません</div></div>';
      t += LEGEND + '<table class="count-table">' + head + '<tbody>';
      x.people.forEach(function (p) {
        t += '<tr><th class="name">' + esc(p.resident.name) + ' さん<small>' + esc(Rooms.roomName(p.room)) + '</small></th>' +
          meals.map(function (k) {
            const key = Meals.key(p.resident.id, date, k.key);
            const v = plans[key];
            return '<td><button type="button" class="mark-cell meal-mark ' + Meals.cellClass(v, byWho[key]) + '" data-resident="' + esc(p.resident.id) + '" data-meal="' + k.key + '"' +
              ' aria-label="' + esc(p.resident.name) + ' さん ' + k.label + ' ' + Meals.mark(v) + '">' + Meals.mark(v) + '</button></td>';
          }).join('') + '</tr>';
      });
      t += '</tbody><tfoot><tr><th class="name">○ の数</th>' +
        meals.map(function (k) { return countCell(countOf(x.people, k.key)); }).join('') + '</tr></tfoot></table></div>';
      return t;
    }).join('');
  }

  async function load() {
    App.setStatus($('loadStatus'), '');
    try {
      const rows = await App.rpc('get_meal_plans', { p_from: date, p_to: date });
      plans = Meals.index(rows);
      byWho = Meals.byIndex(rows);
    } catch (err) {
      console.error(err);
      plans = {};
      byWho = {};
      App.setStatus($('loadStatus'), '食事の予定を読み込めませんでした', 'err');
    }
    render();
  }

  // スタッフが ○ × を変える(未 → ○ → × → ○ …)。スタッフが変えたものとして残す
  async function onMarkClick(e) {
    const b = e.target.closest('button[data-meal]');
    if (!b) return;
    const k = Meals.key(b.dataset.resident, date, b.dataset.meal);
    const before = plans[k], beforeBy = byWho[k];
    const next = before === true ? false : true;
    plans[k] = next; byWho[k] = 'staff';
    render();
    App.setStatus($('loadStatus'), '');
    try {
      await App.rpc('set_meal_plan', { p_resident_id: b.dataset.resident, p_date: date, p_meal: b.dataset.meal, p_will_eat: next, p_by: 'staff' });
    } catch (err) {
      console.error(err);
      if (before === undefined) { delete plans[k]; delete byWho[k]; } else { plans[k] = before; byWho[k] = beforeBy; }
      render();
      App.setStatus($('loadStatus'), '保存できませんでした。通信状況を確認してください', 'err');
    }
  }

  async function goDate(d) {
    if (!d) return;
    date = d;
    await load();
  }

  App.boot({
    active: 'meals',
    onReady: async function () {
      await Rooms.load();
      $('prevDay').addEventListener('click', function () { goDate(Meals.addDays(date, -1)); });
      $('nextDay').addEventListener('click', function () { goDate(Meals.addDays(date, 1)); });
      $('todayBtn').addEventListener('click', function () { goDate(App.todayJST()); });
      $('dateInput').addEventListener('change', function () { goDate(this.value); });
      $('houseCards').addEventListener('click', onMarkClick);
      // チップと、まとめのハウス名で切り替える
      function onView(e) {
        const b = e.target.closest('button[data-view]');
        if (!b) return;
        view = b.dataset.view;
        try { localStorage.setItem(VIEW_KEY, view); } catch (e2) { /* noop */ }
        render();
      }
      $('viewChips').addEventListener('click', onView);
      $('sumTable').addEventListener('click', onView);
      try { view = localStorage.getItem(VIEW_KEY) || 'sum'; } catch (e) { /* noop */ }
      await load();
    },
  });
</script>

</body>
</html>
