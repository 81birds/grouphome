<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>利用者さんの画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* ----- 利用者さんを選ぶ ----- */
    .person-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 520px) { .person-grid { grid-template-columns: repeat(3, 1fr); } }
    .person-btn {
      font-family: var(--font-base); text-align: left; cursor: pointer;
      padding: 12px; min-height: 56px;
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      background: var(--color-surface-alt); color: var(--color-text);
    }
    .person-btn .p-name { display: block; font-size: 15px; font-weight: 700; }
    .person-btn .p-room { display: block; font-size: 11px; color: var(--color-text-muted); }
    .person-btn:hover { border-color: var(--color-primary); background: var(--color-primary-soft); }

    .sample-note {
      display: flex; gap: 6px; align-items: flex-start;
      font-size: 12px; line-height: 1.6; color: var(--color-text-muted);
      background: var(--color-surface-alt); border-radius: var(--radius-sm);
      padding: 8px 10px; margin: -6px 0 14px;
    }
    .sample-note i { font-size: 16px; color: var(--color-primary-dark); margin-top: 1px; }

    /* ----- その人の画面の上 ----- */
    .me-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .me-bar .me-icon { font-size: 40px; color: var(--color-primary-dark); }
    .me-bar .me-name { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .me-bar .me-place { font-size: 12px; color: var(--color-text-muted); }
    .me-bar .spacer { flex: 1; }

    /* ----- 外出・もどり ----- */
    .out-state {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: var(--radius-md); margin-bottom: 12px;
      font-size: 16px; font-weight: 700;
      background: var(--color-primary-soft); color: var(--color-primary-dark);
    }
    .out-state i { font-size: 22px; }
    .out-state small { display: block; font-size: 12px; font-weight: 500; }
    .out-state.out { background: var(--color-work-soft); color: var(--color-work-dark); }
    .out-label { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
    .dest-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .dest-btn {
      font-family: var(--font-base); font-size: 14px; font-weight: 700; cursor: pointer;
      padding: 10px 4px; border-radius: var(--radius-md);
      border: 1px solid var(--color-border); background: var(--color-surface-alt); color: var(--color-text);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .dest-btn i { font-size: 20px; color: var(--color-primary-dark); }
    .dest-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .dest-btn.active i { color: #fff; }
    #destOther { margin-bottom: 10px; }
    .out-btn { padding: 13px 14px; font-size: 16px; }
    .out-hist { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; }
    .out-hist li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--color-border); }
    .out-hist .t { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3em; }

    /* ----- 食事表 ----- */
    .meal-note { font-size: 12px; color: var(--color-text-muted); margin: -6px 0 10px; }
    .meal-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .meal-table th, .meal-table td { border-bottom: 1px solid var(--color-border); padding: 4px; text-align: center; }
    .meal-table thead th { font-size: 12px; color: var(--color-text-muted); }
    .meal-table th.d { width: 76px; text-align: left; font-size: 13px; font-weight: 700; color: var(--color-text); white-space: nowrap; }
    .meal-table th.d.sat { color: var(--color-sat); }
    .meal-table th.d.sun { color: var(--color-danger); }
    .meal-table tr.today th.d::after { content: "きょう"; display: block; font-size: 10px; color: var(--color-primary-dark); }
    .meal-table tr.week-start th, .meal-table tr.week-start td { border-top: 2px solid var(--color-border); }
    .meal-btn {
      width: 100%; height: 44px; cursor: pointer;
      font-family: var(--font-base); font-size: 22px; font-weight: 700; line-height: 1;
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    }
    .meal-none { font-size: 12px; color: var(--color-text-muted); }
  </style>
</head>
<body>

<nav id="gtoolBar"></nav>

<div id="loadingScreen" class="loading-screen">
  <i class="ti ti-loader-2 spin"></i>
  <div>確認しています...</div>
</div>

<div id="mainContent" hidden>
  <div class="wrap">

    <!-- ① ハウスと利用者さんを選ぶ -->
    <div id="pickView" hidden>
      <div class="page-header">
        <h1>
          <span class="page-icon"><i class="ti ti-device-mobile-message"></i></span>
          利用者さんの画面
        </h1>
        <p>ハウスと、あなたの名前を選んでください</p>
      </div>
      <p class="sample-note"><i class="ti ti-info-circle"></i>これはサンプルです。ためしに見られるよう、いまはすべての機能を同じ合言葉(同じ ID)で使えます。本番では、利用者さんごとにログインして、自分の画面だけが見られるようにします。</p>
      <div class="card">
        <h2><i class="ti ti-building-community"></i>ハウス</h2>
        <div class="chips" id="houseChips"></div>
      </div>
      <div class="card" id="personCard" hidden>
        <h2><i class="ti ti-users"></i>お名前</h2>
        <div class="person-grid" id="personGrid"></div>
        <div id="personMsg" class="empty-msg" hidden>このハウスに入居している利用者さんがいません</div>
      </div>
    </div>

    <!-- ② その人の画面 -->
    <div id="homeView" hidden>
      <div class="me-bar">
        <i class="ti ti-user-circle me-icon"></i>
        <div>
          <div class="me-name" id="meName"></div>
          <div class="me-place" id="mePlace"></div>
        </div>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="backBtn"><i class="ti ti-arrow-left"></i>もどる</button>
      </div>

      <!-- 本日のスタッフ -->
      <div class="card">
        <h2><i class="ti ti-users-group"></i><span id="visitTitle">本日のスタッフ</span><span class="visit-sum" id="visitSum"></span></h2>
        <div class="tl" id="visitList"></div>
      </div>

      <!-- 本日の予定(通院・出勤などは本部で入れる。まだ作っていない) -->
      <div class="card">
        <h2><i class="ti ti-calendar-event"></i>本日の予定</h2>
        <div class="empty-msg">まだ予定はありません</div>
      </div>

      <!-- 外出・もどり(日々の記録に「外出」「もどり」として残る) -->
      <div class="card">
        <h2><i class="ti ti-door-exit"></i>外出・もどり</h2>
        <div class="out-state" id="outState"></div>

        <div id="goBox">
          <p class="out-label">どこへ行きますか?</p>
          <div class="dest-grid" id="destGrid"></div>
          <input type="text" id="destOther" placeholder="行き先(なくてもよい)" hidden>
          <button type="button" class="btn btn-block out-btn" id="goBtn" disabled><i class="ti ti-walk"></i>外出する</button>
        </div>
        <div id="backBox" hidden>
          <button type="button" class="btn btn-block out-btn" id="returnBtn"><i class="ti ti-home"></i>もどりました</button>
        </div>
        <div id="outStatus" class="status-msg center"></div>

        <ul class="out-hist" id="outHist"></ul>
      </div>

      <!-- 食事表 -->
      <div class="card">
        <h2><i class="ti ti-tools-kitchen-2"></i>食事表</h2>
        <p class="meal-note">○ = 食べる、× = 食べない。押すたびに切り替わります。平日の昼食はありません</p>
        <table class="meal-table" id="mealTable"></table>
        <div id="mealStatus" class="status-msg center"></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/rooms.js"></script>
<script src="js/staffday.js"></script>
<script src="js/meals.js"></script>
<script>
  const DAYS = 14;                       // 食事表は今日から 2 週間
  const ME_KEY = 'gh_family_resident';   // この端末で選んだ利用者さん

  const $ = function (id) { return document.getElementById(id); };
  const esc = App.escapeHtml;

  let today = App.todayJST();
  let houseId = null;
  let meId = null;
  let plans = {};                        // Meals.index の形
  let outRecs = [];                      // きょうの「外出」「もどり」(この人の分)
  let dest = null;                       // 選んでいる行き先

  // 外出の行き先。日々の記録には kind「外出」、コメントに行き先を入れる
  const DESTS = [
    { name: '通所',   icon: 'ti-bus' },
    { name: '会社',   icon: 'ti-briefcase' },
    { name: '買い物', icon: 'ti-shopping-cart' },
    { name: '散歩',   icon: 'ti-walk' },
    { name: 'その他', icon: 'ti-dots' },
  ];

  function activeHouses() { return Rooms.houses.filter(function (h) { return h.is_active; }); }

  // その日にハウスの部屋に入居している人(部屋の順)
  function peopleOfHouse(hid) {
    const out = [];
    Rooms.roomsOf(hid, true).forEach(function (room) {
      const a = Rooms.occupantOf(room.id, today);
      const p = a ? Rooms.resident(a.resident_id) : null;
      if (p) out.push({ resident: p, room: room });
    });
    return out;
  }

  // ===== ① 選ぶ =====
  function showPick() {
    $('homeView').hidden = true;
    $('pickView').hidden = false;
    renderHouses();
    renderPeople();
    history.replaceState(null, '', location.pathname);
  }
  function renderHouses() {
    $('houseChips').innerHTML = activeHouses().map(function (h) {
      return '<button type="button" data-house="' + esc(h.id) + '"' + (h.id === houseId ? ' class="active"' : '') + '>' + esc(h.name) + '</button>';
    }).join('') || '<span class="muted text-sm">ハウスが登録されていません</span>';
  }
  function renderPeople() {
    $('personCard').hidden = !houseId;
    if (!houseId) return;
    const people = peopleOfHouse(houseId);
    $('personGrid').innerHTML = people.map(function (x) {
      return '<button type="button" class="person-btn" data-resident="' + esc(x.resident.id) + '">' +
        '<span class="p-name">' + esc(x.resident.name) + ' さん</span>' +
        '<span class="p-room">' + esc(Rooms.roomName(x.room)) + '</span></button>';
    }).join('');
    $('personMsg').hidden = people.length > 0;
  }

  // ===== ② その人の画面 =====
  async function showHome(residentId) {
    const p = Rooms.resident(residentId);
    const cur = p ? Rooms.currentOf(residentId, today) : null;
    if (!cur) { showPick(); return; }     // いま入居していない人は選びなおし
    meId = residentId;
    houseId = (Rooms.room(cur.room_id) || {}).house_id || null;
    try { localStorage.setItem(ME_KEY, meId); } catch (e) { /* noop */ }
    history.replaceState(null, '', location.pathname + '?resident=' + encodeURIComponent(meId));

    $('pickView').hidden = true;
    $('homeView').hidden = false;
    $('meName').textContent = p.name + ' さん';
    $('mePlace').textContent = Rooms.placeText(cur);
    window.scrollTo(0, 0);

    dest = null;
    $('destOther').value = '';
    App.setStatus($('outStatus'), '');
    await Promise.all([StaffDay.loadShifts(today), loadPlans(), loadOut()]);
    $('visitTitle').textContent = StaffDay.title(today);
    $('visitSum').textContent = StaffDay.render($('visitList'), houseId, today);
    renderOut();
    renderMeals();
  }

  // ===== 外出・もどり =====
  function hhmm(t) { return String(t).slice(0, 5); }
  function nowTime() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(11, 16); }

  async function loadOut() {
    try {
      const recs = await App.rpc('get_daily_records', { p_house_id: houseId, p_date: today });
      outRecs = recs.filter(function (r) { return r.resident_id === meId && (r.kind === '外出' || r.kind === 'もどり'); });
    } catch (err) {
      console.error(err);
      outRecs = [];
      App.setStatus($('outStatus'), '外出の記録を読み込めませんでした', 'err');
    }
  }

  // 最後が「外出」なら外出中
  function lastOut() {
    const last = outRecs[outRecs.length - 1];
    return last && last.kind === '外出' ? last : null;
  }

  function renderOut() {
    const out = lastOut();
    const st = $('outState');
    st.className = 'out-state' + (out ? ' out' : '');
    st.innerHTML = out
      ? '<i class="ti ti-walk"></i><div>外出中<small>' + esc((out.note || '行き先なし') + '・' + hhmm(out.record_time) + ' から') + '</small></div>'
      : '<i class="ti ti-home"></i><div>ハウスにいます</div>';
    $('goBox').hidden = !!out;
    $('backBox').hidden = !out;

    $('destGrid').innerHTML = DESTS.map(function (d) {
      return '<button type="button" class="dest-btn' + (d.name === dest ? ' active' : '') + '" data-dest="' + esc(d.name) + '" aria-pressed="' + (d.name === dest) + '">' +
        '<i class="ti ' + d.icon + '"></i>' + esc(d.name) + '</button>';
    }).join('');
    $('destOther').hidden = dest !== 'その他';
    $('goBtn').disabled = !dest;

    $('outHist').innerHTML = outRecs.slice().reverse().map(function (r) {
      return '<li><span class="t">' + esc(hhmm(r.record_time)) + '</span><span>' + esc(r.kind) + (r.note ? '(' + esc(r.note) + ')' : '') + '</span></li>';
    }).join('');
  }

  async function addOut(kind, note) {
    const t = nowTime();
    const btns = [$('goBtn'), $('returnBtn')];
    btns.forEach(function (b) { b.disabled = true; });
    try {
      const added = await App.rpc('add_daily_records', {
        p_resident_id: meId, p_house_id: houseId, p_date: today, p_time: t, p_kinds: [kind], p_note: note,
      });
      outRecs = outRecs.concat(added || []);
    } catch (err) {
      console.error(err);
      App.setStatus($('outStatus'), '記録できませんでした。通信状況を確認してください', 'err');
      btns.forEach(function (b) { b.disabled = false; });
      renderOut();
      return;
    }
    $('returnBtn').disabled = false;
    dest = null;
    $('destOther').value = '';
    App.setStatus($('outStatus'), t + ' に「' + kind + '」を記録しました', 'ok');
    renderOut();
  }

  function onGo() {
    if (!dest) return;
    // その他は、書いてあればその行き先にする
    const other = $('destOther').value.trim();
    addOut('外出', dest === 'その他' ? (other ? 'その他: ' + other : 'その他') : dest);
  }

  async function loadPlans() {
    try {
      plans = Meals.index(await App.rpc('get_meal_plans', { p_from: today, p_to: Meals.addDays(today, DAYS - 1), p_resident_id: meId }));
    } catch (err) {
      console.error(err);
      plans = {};
      App.setStatus($('mealStatus'), '食事表を読み込めませんでした', 'err');
    }
  }

  function renderMeals() {
    let html = '<thead><tr><th class="d"></th>' + Meals.KINDS.map(function (k) {
      return '<th><i class="ti ' + k.icon + '"></i> ' + k.label + '</th>';
    }).join('') + '</tr></thead><tbody>';
    for (let i = 0; i < DAYS; i++) {
      const d = Meals.addDays(today, i);
      const cls = [];
      if (d === today) cls.push('today');
      if (i > 0 && Meals.dow(d) === 1) cls.push('week-start');   // 月曜で区切る
      html += '<tr class="' + cls.join(' ') + '"><th class="d ' + Meals.dayClass(d) + '">' + Meals.dateLabel(d) + '</th>';
      Meals.KINDS.forEach(function (k) {
        if (!Meals.hasMeal(d, k.key)) { html += '<td><span class="meal-none">—</span></td>'; return; }
        const v = plans[Meals.key(meId, d, k.key)];
        html += '<td><button type="button" class="meal-btn meal-mark ' + Meals.markClass(v) + '" data-date="' + d + '" data-meal="' + k.key + '"' +
          ' aria-label="' + Meals.dateLabel(d) + ' ' + k.label + ' ' + Meals.mark(v) + '">' + (v === undefined ? '' : Meals.mark(v)) + '</button></td>';
      });
      html += '</tr>';
    }
    $('mealTable').innerHTML = html + '</tbody>';
  }

  // 押すたびに ○ → × → ○ …(まだ選んでいないときは ○ から)
  async function onMealClick(e) {
    const b = e.target.closest('button[data-meal]');
    if (!b) return;
    const k = Meals.key(meId, b.dataset.date, b.dataset.meal);
    const before = plans[k];
    const next = before === true ? false : true;
    plans[k] = next;
    renderMeals();
    App.setStatus($('mealStatus'), '');
    try {
      await App.rpc('set_meal_plan', { p_resident_id: meId, p_date: b.dataset.date, p_meal: b.dataset.meal, p_will_eat: next });
    } catch (err) {
      console.error(err);
      if (before === undefined) delete plans[k]; else plans[k] = before;
      renderMeals();
      App.setStatus($('mealStatus'), '保存できませんでした。通信状況を確認してください', 'err');
    }
  }

  App.boot({
    active: 'family',
    onReady: async function () {
      await Promise.all([Rooms.load(), StaffDay.loadMasters()]);

      $('houseChips').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-house]');
        if (!b) return;
        houseId = b.dataset.house;
        renderHouses();
        renderPeople();
      });
      $('personGrid').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-resident]');
        if (b) showHome(b.dataset.resident);
      });
      $('backBtn').addEventListener('click', function () {
        try { localStorage.removeItem(ME_KEY); } catch (e) { /* noop */ }
        showPick();
      });
      $('mealTable').addEventListener('click', onMealClick);
      $('destGrid').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-dest]');
        if (!b) return;
        dest = dest === b.dataset.dest ? null : b.dataset.dest;
        renderOut();
        if (dest === 'その他') $('destOther').focus();
      });
      $('goBtn').addEventListener('click', onGo);
      $('returnBtn').addEventListener('click', function () { addOut('もどり', null); });

      // URL か、この端末で前に選んだ人がいれば、その人の画面から
      let want = new URLSearchParams(location.search).get('resident');
      if (!want) { try { want = localStorage.getItem(ME_KEY); } catch (e) { /* noop */ } }
      if (want && Rooms.resident(want)) await showHome(want);
      else showPick();
    },
  });
</script>

</body>
</html>
