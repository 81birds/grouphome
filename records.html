<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日々の記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* ----- 日にち ----- */
    .date-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    #houseChips { margin-bottom: 0; }
    .date-row input[type="date"] { width: auto; font-size: 14px; }
    .date-row .date-label { font-size: 13px; font-weight: 700; min-width: 3em; }

    /* ----- 利用者のボタン ----- */
    .person-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    @media (min-width: 520px) { .person-grid { grid-template-columns: repeat(4, 1fr); } }
    .person-btn {
      font-family: var(--font-base);
      position: relative;
      text-align: left;
      padding: 6px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-alt);
      color: var(--color-text);
      cursor: pointer;
      min-height: 40px;
    }
    .person-btn .p-name { display: block; font-size: 13px; font-weight: 700; padding-right: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person-btn .p-room { display: block; font-size: 10px; color: var(--color-text-muted); }
    .person-btn .p-count {
      position: absolute; top: 5px; right: 5px;
      font-size: 10px; font-weight: 700;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--color-primary-soft); color: var(--color-primary-dark);
    }
    /* 選んでいる利用者さんは薄いオレンジ(上の帯と同じ色) */
    .person-btn.active { background: var(--color-work-soft); border-color: var(--color-work); color: var(--color-work-dark); box-shadow: inset 0 0 0 1px var(--color-work); }
    /* 空室(押せない) */
    .person-btn.vacant { cursor: default; background: transparent; border-style: dashed; color: var(--color-text-muted); }
    .person-btn.vacant .p-name { font-weight: 500; }

    /* ----- 施設のカードの中の、本日のスタッフ(小さめ) ----- */
    .visit-box { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--color-border); }
    .visit-head { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 0 0 4px; }
    .visit-head i { color: var(--color-primary-dark); }
    .visit-box .tl-scale, .visit-box .tl-row { grid-template-columns: 76px 1fr; }
    .visit-box .tl-row { padding: 3px 0; }
    .visit-box .tl-name { font-size: 12px; }
    .visit-box .tl-track { height: 18px; }
    .visit-box .tl-time { font-size: 10px; margin-top: 1px; }
    .visit-box .empty-msg { padding: 8px; font-size: 12px; }
    .person-btn.active .p-room { color: var(--color-work-dark); }
    .person-btn.active .p-count { background: var(--color-surface); color: var(--color-work-dark); }

    /* ----- 時刻のホイール(iPhone のアラーム風) ----- */
    .wheel-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .wheel {
      --item-h: 40px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      height: calc(var(--item-h) * 5);
      width: 200px;
      user-select: none; -webkit-user-select: none;
    }
    .wheel-band {
      position: absolute; left: 0; right: 0;
      top: calc(50% - var(--item-h) / 2); height: var(--item-h);
      border-radius: var(--radius-md);
      background: var(--color-primary-soft);
      pointer-events: none;
    }
    .wheel-col {
      position: relative;
      width: 72px; height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: calc(var(--item-h) * 2) 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 35%, #000 65%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0, #000 35%, #000 65%, transparent 100%);
    }
    .wheel-col::-webkit-scrollbar { display: none; }
    .wheel-item {
      height: var(--item-h);
      display: flex; align-items: center; justify-content: center;
      scroll-snap-align: center;
      font-size: 22px; font-variant-numeric: tabular-nums;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .wheel-item.sel { color: var(--color-text); font-weight: 700; font-size: 26px; }
    .wheel-sep { position: relative; font-size: 24px; font-weight: 700; padding-bottom: 3px; }

    /* ----- 内容のチップ(系統ごとに薄い色) ----- */
    .kind-groups { margin: 4px 0 0; }
    .kind-group { margin-bottom: 10px; }
    .kind-group-name { font-size: 11px; font-weight: 700; color: var(--color-text-muted); margin: 0 0 4px 2px; }
    .kind-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kind-btn {
      font-family: var(--font-base);
      font-size: 14px; font-weight: 700;
      padding: 12px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface-alt);
      color: var(--color-text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .kind-btn i { font-size: 18px; color: var(--color-primary-dark); }
    .cat-meal .kind-btn { background: var(--color-cat-meal); }
    .cat-out  .kind-btn { background: var(--color-cat-out); }
    .cat-med  .kind-btn { background: var(--color-cat-med); }
    .cat-talk .kind-btn { background: var(--color-cat-talk); }
    .kind-group .kind-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .kind-btn.active i { color: #fff; }

    /* ----- 時刻(外出・通所は 出発 と もどり の 2 つ) ----- */
    .time-block { margin-top: 6px; }
    .time-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin: 0 0 2px; }
    .time-label input { width: 18px; height: 18px; margin: 0; }
    #backWheelWrap.off { opacity: 0.35; pointer-events: none; }


    /* ----- 入力のダイアログ ----- */

    .modal-foot .status-msg { margin: 0 0 8px; }
    #inputModal .modal-sticky .modal-ctx { margin: 0; }
    #inputModal .kind-groups { margin-top: 12px; }
    .modal-foot .status-msg:empty { display: none; }

    /* 背の低いスマホ: ホイールを 3 段にし、チップを小さめにして、ダイアログに収める */
    @media (max-height: 760px) {
      .wheel { height: calc(var(--item-h) * 3); }
      .wheel-col { padding: var(--item-h) 0; }
      .kind-btn { padding: 9px 8px; font-size: 13px; }
      .kind-grid { gap: 6px; }
      .kind-group { margin-bottom: 6px; }
    }

    /* ----- PC: 左に施設・スタッフ・利用者さん、右にその人の記録 ----- */
    @media (min-width: 1000px) {
      .rec-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 20px; align-items: start; }
      .rec-main .rec-list li { font-size: 15px; padding: 10px 2px; }
      .person-btn .p-name { font-size: 14px; }
    }
    .new-btn { margin-top: 12px; }

    /* ----- きょうの日課 ----- */
    .rt-today { background: var(--color-surface-alt); border-radius: var(--radius-md); padding: 8px 10px; margin-bottom: 12px; }
    .rt-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--color-text-muted); margin-bottom: 4px; }
    .rt-head i { color: var(--color-primary-dark); }
    .rt-head .rt-edit { margin-left: auto; white-space: nowrap; }
    .rt-none { font-size: 13px; color: var(--color-text-muted); padding: 2px 0 4px; }
    .rt-today ul { list-style: none; margin: 0; padding: 0; }
    .rt-today li { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; border-top: 1px dashed var(--color-border); }
    .rt-today li:first-child { border-top: none; }
    .rt-today .t { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; }
    .rt-today .c { flex: 1; min-width: 0; }
    .rt-today .btn-sm { white-space: nowrap; }
    .cat-routine .kind-btn { background: var(--color-primary-soft); }

    /* ----- その日の記録 ----- */
    .rec-list { list-style: none; margin: 0; padding: 0; }
    .rec-list li {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px solid var(--color-border);
      font-size: 14px;
    }
    .rec-list li:last-child { border-bottom: none; }
    .rec-time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.2em; }
    .rec-kind { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rec-kind i { color: var(--color-primary-dark); }
    .rec-note {
      flex-basis: 100%; font-size: 12px; color: var(--color-text-muted);
      white-space: pre-wrap; word-break: break-word;
    }
    .rec-note i { font-size: 12px; color: var(--color-text-muted); }
    /* 日課から記録したもの(日課の内容と同じ記録) */
    .rec-routine {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
      background: var(--color-primary-soft); color: var(--color-primary-dark);
    }
    .rec-kind .rec-routine i { font-size: 12px; }

    /* ----- いまの施設・日にち(下にスクロールしても上に出しておく) ----- */
    .ctx-bar {
      position: fixed; top: var(--gtool-h); left: 0; right: 0; z-index: 900;
      display: block; width: 100%; padding: 0; cursor: pointer;
      border: none; border-bottom: 1px solid var(--color-border);
      background: var(--color-surface); box-shadow: var(--shadow-md);
      font-family: var(--font-base); text-align: left; color: var(--color-text);
      transform: translateY(-110%); transition: transform 0.15s ease; visibility: hidden;
    }
    .ctx-bar.show { transform: none; visibility: visible; }
    .ctx-bar .inner { max-width: 1100px; margin: 0 auto; padding: 10px 12px; }
    /* 利用者さんを選んでいるときは、選んだチップと同じ薄いオレンジ */
    .ctx-bar.working { background: var(--color-work-soft); border-bottom: 2px solid var(--color-work); }
    .ctx-bar.working .ctx-line,
    .ctx-bar.working .ctx-line i,
    .ctx-bar.working .ctx-line .today,
    .ctx-bar.working .ctx-line .sep { color: var(--color-work-dark); }
    /* 利用者さんを選んで一覧へ移るとき、上の 2 本の帯に隠れないように */
    #listCard { scroll-margin-top: calc(var(--gtool-h) + 52px); }

    /* 「〇〇さんの記録を入力中です」(新しい入力のダイアログ)と、施設・日にちの行 */
    .ctx-doing { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; margin-bottom: 3px; }
    .ctx-doing i { font-size: 18px; }
    .ctx-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; font-weight: 700; }
    .ctx-line i { color: var(--color-primary-dark); }
    .ctx-line .sep { color: var(--color-text-muted); font-weight: 400; }
    .ctx-line .today { color: var(--color-primary-dark); }
    .ctx-line .past { background: var(--color-danger); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; }

    /* ダイアログの中の施設と日にち */
    .modal-ctx { margin: -6px 0 12px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--color-surface-alt); }
    /* 新しい入力のダイアログだけ、オレンジで「入力中です」を出す */
    .modal-ctx.working { background: var(--color-work-soft); border-left: 4px solid var(--color-work); color: var(--color-work-dark); }
    .modal-ctx.working i,
    .modal-ctx.working .ctx-line .today,
    .modal-ctx.working .ctx-line .sep { color: var(--color-work-dark); }

    /* 新しい入力のコメント */
    .input-note { margin-top: 12px; }
    .input-note textarea { min-height: 56px; }

    /* ----- 記録の編集ダイアログ ----- */
    .edit-what { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .edit-what i { color: var(--color-primary-dark); }
    #editModal .modal-actions { justify-content: space-between; }
    .edit-wheel { margin-bottom: 12px; }
  </style>
</head>
<body>

<nav id="gtoolBar"></nav>

<div id="loadingScreen" class="loading-screen">
  <i class="ti ti-loader-2 spin"></i>
  <div>確認しています...</div>
</div>

<div id="mainContent" hidden>
  <div class="wrap wide">
    <div class="page-header">
      <h1>
        <span class="page-icon"><i class="ti ti-notebook"></i></span>
        日々の記録
      </h1>
      <p>施設と利用者さんを選ぶと、その日の記録が出ます。「新しい入力」で時刻と内容を選んで記録します</p>
    </div>

    <div class="rec-layout">
    <div class="rec-side">
    <!-- 施設と日にち -->
    <div class="card" id="houseCard">
      <div class="date-row">
        <button type="button" class="btn btn-ghost btn-sm" id="prevDay" aria-label="前の日"><i class="ti ti-chevron-left"></i></button>
        <input type="date" id="dateInput" aria-label="日にち">
        <span class="date-label" id="dateLabel"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="nextDay" aria-label="次の日"><i class="ti ti-chevron-right"></i></button>
      </div>
      <h2><i class="ti ti-building-community"></i>施設</h2>
      <div class="chips" id="houseChips"></div>

      <!-- 本日のスタッフ(選んだ施設の。同じカードの中に小さく出す) -->
      <div class="visit-box" id="visitCard" hidden>
        <h3 class="visit-head"><i class="ti ti-users-group"></i><span id="visitTitle">本日のスタッフ</span><span class="visit-sum" id="visitSum"></span></h3>
        <div class="tl" id="visitList"></div>
      </div>
    </div>

    <!-- 利用者 -->
    <div class="card" id="personCard" hidden>
      <h2><i class="ti ti-users"></i>利用者さん</h2>
      <div class="person-grid" id="personGrid"></div>
      <div id="personMsg" class="empty-msg" hidden></div>
    </div>

    </div>

    <div class="rec-main">
    <!-- その人のその日の記録 -->
    <div class="card" id="listCard" hidden>
      <h2><i class="ti ti-list"></i><span id="listTitle"></span></h2>
      <!-- きょうの日課(利用者さんDB のプロファイルで入れたもの)。「記録」でその時刻・内容から入力できる -->
      <div class="rt-today" id="rtToday" hidden>
        <div class="rt-head"><i class="ti ti-calendar-repeat"></i>きょうの日課
          <a class="btn btn-ghost btn-sm rt-edit" id="rtEditLink" href="profile.html"><i class="ti ti-settings"></i>日課を編集</a>
        </div>
        <ul id="rtTodayList"></ul>
        <div class="rt-none" id="rtNone" hidden>きょうの日課はありません</div>
      </div>
      <ul class="rec-list" id="recList"></ul>
      <div id="listMsg" class="empty-msg" hidden>まだ記録はありません</div>
      <button type="button" class="btn btn-block new-btn" id="newBtn"><i class="ti ti-plus"></i>新しい入力</button>
      <div id="listStatus" class="status-msg center"></div>
    </div>
    </div>
    </div>
  </div>
</div>

<!-- 下にスクロールしたときに上に出す、いまの施設・日にち。押すと上に戻る -->
<button type="button" class="ctx-bar" id="ctxBar" aria-label="施設と日にちを変える"><div class="inner" id="ctxBarInner"></div></button>

<!-- 入力のダイアログ(時刻と内容) -->
<div id="inputModal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="inputHead">
    <div class="modal-head">
      <h2 id="inputHead"><i class="ti ti-pencil"></i><span id="inputTitle"></span></h2>
      <button type="button" class="icon-btn" id="inputClose" aria-label="閉じる"><i class="ti ti-x"></i></button>
    </div>
    <!-- 「〇〇さんの記録を入力中です」は、中をスクロールしても上に残す -->
    <div class="modal-sticky"><div class="modal-ctx working" id="inputCtx"></div></div>

    <div class="time-block">
      <div class="time-label" id="departLabel">時刻</div>
      <div class="wheel-wrap">
        <div class="wheel" aria-label="時刻">
          <div class="wheel-band"></div>
          <div class="wheel-col" id="wheelH" aria-label="時"></div>
          <div class="wheel-sep">:</div>
          <div class="wheel-col" id="wheelM" aria-label="分"></div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="nowBtn"><i class="ti ti-clock"></i>いま</button>
      </div>
    </div>

    <!-- 外出・通所のときだけ: もどりの時刻(一緒に「もどり」も記録する) -->
    <div class="time-block" id="backBlock" hidden>
      <label class="time-label"><input type="checkbox" id="backOn" checked>もどりも記録する</label>
      <div class="wheel-wrap" id="backWheelWrap">
        <div class="wheel" aria-label="もどりの時刻">
          <div class="wheel-band"></div>
          <div class="wheel-col" id="backWheelH" aria-label="時"></div>
          <div class="wheel-sep">:</div>
          <div class="wheel-col" id="backWheelM" aria-label="分"></div>
        </div>
      </div>
    </div>

    <!-- 内容(時計の下) -->
    <div class="kind-groups" id="kindGrid"></div>

    <div class="field input-note">
      <label for="newNote">コメント(選んだ内容について。なくてもよい)</label>
      <textarea id="newNote" rows="3" placeholder="内容を選ぶと、よく使う文が入ります。そのまま記録しても、書きかえてもかまいません"></textarea>
    </div>

    <!-- 「記録する」はダイアログの下に固定(スマホで画面の外に出ないように) -->
    <div class="modal-foot">
      <div id="saveStatus" class="status-msg center"></div>
      <button type="button" class="btn btn-block" id="saveBtn" disabled><i class="ti ti-check"></i>記録する</button>
    </div>
  </div>
</div>

<!-- 記録の編集ダイアログ(コメント・取消) -->
<div id="editModal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editHead">
    <div class="modal-head">
      <h2 id="editHead"><i class="ti ti-edit"></i><span id="editTitle"></span></h2>
      <button type="button" class="icon-btn" id="editClose" aria-label="閉じる"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-ctx" id="editCtx"></div>
    <div class="edit-what" id="editWhat"></div>
    <div class="wheel-wrap edit-wheel">
      <div class="wheel" aria-label="時刻">
        <div class="wheel-band"></div>
        <div class="wheel-col" id="editWheelH" aria-label="時"></div>
        <div class="wheel-sep">:</div>
        <div class="wheel-col" id="editWheelM" aria-label="分"></div>
      </div>
    </div>
    <div class="field">
      <label for="editNote">コメント</label>
      <textarea id="editNote" rows="4" placeholder="例: 半分ほど食べました"></textarea>
    </div>
    <div id="editStatus" class="status-msg"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="editVoid"><i class="ti ti-trash"></i>記録を取り消す</button>
      <button type="button" class="btn" id="editSave"><i class="ti ti-device-floppy"></i>保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/rooms.js"></script>
<script src="js/staffday.js"></script>
<script src="js/routines.js"></script>
<script src="js/vitals.js"></script>
<script>
  // ----- 記録の内容(チップ)。ここに足せば画面に増える -----
  // 系統(色分け)ごとに並べる。note はコメント欄に最初から入る文(そのまま記録してもよい)
  const KIND_GROUPS = [
    { name: '食事', cls: 'meal', kinds: [
      { name: '朝食',   icon: 'ti-sunrise', note: 'ぜんぶ食べました' },
      { name: '昼食',   icon: 'ti-sun',     note: 'ぜんぶ食べました' },
      { name: '夕食',   icon: 'ti-moon',    note: 'ぜんぶ食べました' },
      { name: 'おやつ', icon: 'ti-cookie',  note: 'おやつを食べました' },
    ] },
    { name: 'おでかけ', cls: 'out', kinds: [
      { name: '外出',   icon: 'ti-walk', note: '元気に出かけました', back: true },
      { name: '通所',   icon: 'ti-bus',  note: '元気に通所しました', back: true },
      { name: 'もどり', icon: 'ti-home', note: '無事にもどりました' },
    ] },
    { name: 'お薬', cls: 'med', kinds: [
      // バイタルは押すと別のダイアログで体温・血圧などを入れる(vitals に入る。日々の記録の行にはならない)
      { name: 'バイタル',     icon: 'ti-heartbeat',       vital: true },
      { name: 'お薬おわたし', icon: 'ti-pill',            note: 'お薬をおわたししました' },
      { name: 'お薬空包確認', icon: 'ti-clipboard-check', note: '朝食前後薬 確認\n昼食前後薬 確認\n夕食前後薬 確認\n就寝薬 確認' },
    ] },
    { name: '会話・くらし', cls: 'talk', kinds: [
      { name: 'たのしい雑談', icon: 'ti-mood-smile',      note: '楽しくおしゃべりしました' },
      { name: 'おなやみ相談', icon: 'ti-heart-handshake', note: 'お話をうかがいました' },
      { name: 'おこづかい',   icon: 'ti-coin',            note: 'おこづかいをおわたししました' },
    ] },
  ];
  const KINDS = KIND_GROUPS.reduce(function (a, g) { return a.concat(g.kinds); }, []);
  // 今はチップにないが、前の記録に残っている内容のアイコン
  const OLD_ICONS = { '出勤': 'ti-briefcase' };
  const HOUSE_KEY = 'gh_records_house';
  const ITEM_H = 40;
  const MIN_STEP = 10;          // 分は 10 分きざみ

  let houseId = null;
  let date = App.todayJST();
  let residentId = null;
  let records = [];             // 選んだ施設・日の記録
  let vitals = [];              // 選んだ日のバイタル(全員分。この施設の人だけ使う)
  let picked = new Set();       // 選んでいる内容(1 つだけ)

  const $ = function (id) { return document.getElementById(id); };
  const esc = App.escapeHtml;

  function kindIcon(name) {
    const k = KINDS.find(function (x) { return x.name === name; });
    if (k) return k.icon;
    if (OLD_ICONS[name]) return OLD_ICONS[name];
    // 日課から記録したもの
    return Routines.list.some(function (r) { return r.content === name; }) ? 'ti-calendar-check' : 'ti-point';
  }

  // 日課から入力するとき、チップにない内容をその場だけのチップにする
  let routineKind = null;

  // ===== 時刻のホイール =====
  function buildWheel(col, count, step) {
    let html = '';
    for (let i = 0; i < count; i++) html += '<div class="wheel-item" data-i="' + i + '">' + String(i * step).padStart(2, '0') + '</div>';
    col.innerHTML = html;
    let raf = 0;
    col.addEventListener('scroll', function () {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () { markWheel(col); });
    }, { passive: true });
    col.addEventListener('click', function (e) {
      const it = e.target.closest('.wheel-item');
      if (it) col.scrollTo({ top: +it.dataset.i * ITEM_H, behavior: 'smooth' });
    });
  }
  function wheelValue(col) {
    const n = col.children.length;
    return Math.max(0, Math.min(n - 1, Math.round(col.scrollTop / ITEM_H)));
  }
  function markWheel(col) {
    const v = wheelValue(col);
    Array.prototype.forEach.call(col.children, function (el, i) { el.classList.toggle('sel', i === v); });
  }
  function setWheel(col, v) {
    col.scrollTop = v * ITEM_H;
    markWheel(col);
  }
  // m は分のホイールの位置(0〜5 = 0〜50 分)
  function setTime(h, m, prefix) {
    setWheel($((prefix || 'wheel') + 'H'), h);
    setWheel($((prefix || 'wheel') + 'M'), m);
  }
  // 時・分を 10 分きざみに丸めて [時, 分の位置] で返す(14:37 → 14:40)
  function roundTime(h, m) {
    const t = (Math.round((h * 60 + m) / MIN_STEP) * MIN_STEP) % (24 * 60);
    return [Math.floor(t / 60), (t % 60) / MIN_STEP];
  }
  function nowRounded() {
    const d = new Date(Date.now() + 9 * 3600 * 1000);
    return roundTime(d.getUTCHours(), d.getUTCMinutes());
  }
  function setNow() {
    const n = nowRounded();
    setTime(n[0], n[1]);
  }
  function timeText(prefix) {
    const p = prefix || 'wheel';
    return String(wheelValue($(p + 'H'))).padStart(2, '0') + ':' + String(wheelValue($(p + 'M')) * MIN_STEP).padStart(2, '0');
  }
  function sortRecords() {
    records.sort(function (a, b) {
      return a.record_time < b.record_time ? -1 : a.record_time > b.record_time ? 1 : 0;
    });
  }

  // ===== 施設 =====
  function activeHouses() {
    return Rooms.houses.filter(function (h) { return h.is_active; });
  }
  function renderHouses() {
    $('houseChips').innerHTML = activeHouses().map(function (h) {
      return '<button type="button" data-house="' + esc(h.id) + '"' + (h.id === houseId ? ' class="active"' : '') + '>' + esc(h.name) + '</button>';
    }).join('') || '<span class="muted text-sm">施設が登録されていません</span>';
  }

  // ===== 日にち =====
  function renderDate() {
    renderCtx();
    $('dateInput').value = date;
    const wd = '日月火水木金土'.charAt(new Date(date + 'T00:00:00Z').getUTCDay());
    const today = App.todayJST();
    $('dateLabel').textContent = date === today ? 'きょう(' + wd + ')' : date === App.todayJST(-1) ? 'きのう(' + wd + ')' : '(' + wd + ')';
  }
  // ===== いまの施設・日にち(上の帯とダイアログに出す) =====
  // 施設と日にちの 1 行
  function ctxLine(person) {
    const h = Rooms.houses.find(function (x) { return x.id === houseId; });
    const wd = '日月火水木金土'.charAt(new Date(date + 'T00:00:00Z').getUTCDay());
    const today = App.todayJST();
    const rel = date === today ? ' <span class="today">きょう</span>' : date === App.todayJST(-1) ? ' <span class="past">きのう</span>' : date < today ? ' <span class="past">過去の日</span>' : '';
    return '<div class="ctx-line"><i class="ti ti-building-community"></i>' + esc(h ? h.name : '施設を選んでください') +
      '<span class="sep">・</span><i class="ti ti-calendar"></i>' + (+date.slice(5, 7)) + '/' + (+date.slice(8, 10)) + '(' + wd + ')' + rel +
      (person ? '<span class="sep">・</span><i class="ti ti-user"></i>' + esc(person.name) + ' さん' : '') + '</div>';
  }
  function renderCtx() {
    const p = residentId ? Rooms.resident(residentId) : null;
    $('ctxBarInner').innerHTML = ctxLine(p);
    $('ctxBar').classList.toggle('working', !!p);
    // 新しい入力のダイアログには「〇〇さんの記録を入力中です」をオレンジで出す
    $('inputCtx').innerHTML = (p ? '<div class="ctx-doing"><i class="ti ti-pencil"></i>' + esc(p.name) + ' さんの記録を入力中です</div>' : '') + ctxLine();
    $('editCtx').innerHTML = ctxLine();
  }
  // 施設のカードが画面の上に隠れたら、上の帯を出す
  function watchHouseCard() {
    if (!('IntersectionObserver' in window)) return;
    const gtoolH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gtool-h'), 10) || 46;
    new IntersectionObserver(function (entries) {
      $('ctxBar').classList.toggle('show', !entries[0].isIntersecting && !!houseId);
    }, { rootMargin: '-' + gtoolH + 'px 0px 0px 0px' }).observe($('houseCard'));
  }

  function shiftDate(days) {
    const d = new Date(date + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    changeDate(d.toISOString().slice(0, 10));
  }
  async function changeDate(v) {
    if (!v) return;
    date = v;
    renderDate();
    App.setStatus($('listStatus'), '');
    await Promise.all([loadRecords(), StaffDay.loadShifts(date)]);
    renderVisits();
    renderPeople();
    renderList();
  }

  // ===== 本日のスタッフ(js/staffday.js) =====
  function renderVisits() {
    $('visitCard').hidden = !houseId;
    if (!houseId) return;
    $('visitTitle').textContent = StaffDay.title(date);
    $('visitSum').textContent = StaffDay.render($('visitList'), houseId, date);
  }


  // ===== 利用者 =====
  // その日にこの施設のどこかの部屋に入居している人(部屋の順)
  // 部屋ごとの枠。入居している人がいなければ resident は null(空室)
  function roomSlots() {
    if (!houseId) return [];
    const out = [];
    Rooms.roomsOf(houseId, true).forEach(function (room) {
      const a = Rooms.occupantOf(room.id, date);
      const p = a ? Rooms.resident(a.resident_id) : null;
      if (!p && !room.is_active) return;   // 使っていない部屋は出さない
      out.push({ resident: p, room: room });
    });
    return out;
  }
  function renderPeople() {
    $('personCard').hidden = !houseId;
    if (!houseId) return;
    const slots = roomSlots();
    const people = slots.filter(function (x) { return x.resident; });
    if (residentId && !people.some(function (x) { return x.resident.id === residentId; })) residentId = null;
    // 部屋の数だけ並べる。人がいない部屋は「空室」
    $('personGrid').innerHTML = slots.map(function (x) {
      if (!x.resident) {
        return '<div class="person-btn vacant"><span class="p-name">空室</span><span class="p-room">' + esc(Rooms.roomName(x.room)) + '</span></div>';
      }
      const n = records.filter(function (r) { return r.resident_id === x.resident.id; }).length +
        vitals.filter(function (v) { return v.resident_id === x.resident.id; }).length;
      return '<button type="button" class="person-btn' + (x.resident.id === residentId ? ' active' : '') + '" data-resident="' + esc(x.resident.id) + '">' +
        '<span class="p-name">' + esc(x.resident.name) + ' さん</span>' +
        '<span class="p-room">' + esc(Rooms.roomName(x.room)) + '</span>' +
        (n ? '<span class="p-count" title="この日の記録の数">' + n + '</span>' : '') +
        '</button>';
    }).join('');
    const msg = $('personMsg');
    msg.hidden = slots.length > 0;
    msg.textContent = 'この施設には部屋が登録されていません。施設DB の画面で部屋を追加してください';
  }

  // ===== 入力と一覧 =====
  function pickedKind() {
    if (routineKind && picked.has(routineKind.name)) return routineKind;
    return KINDS.find(function (k) { return picked.has(k.name); }) || null;
  }

  function renderKinds() {
    const groups = routineKind ? [{ name: '日課から', cls: 'routine', kinds: [routineKind] }].concat(KIND_GROUPS) : KIND_GROUPS;
    $('kindGrid').innerHTML = groups.map(function (g) {
      return '<div class="kind-group cat-' + g.cls + '"><div class="kind-group-name">' + esc(g.name) + '</div><div class="kind-grid">' +
        g.kinds.map(function (k) {
          return '<button type="button" class="kind-btn' + (picked.has(k.name) ? ' active' : '') + '" data-kind="' + esc(k.name) + '" aria-pressed="' + picked.has(k.name) + '">' +
            '<i class="ti ' + k.icon + '"></i>' + esc(k.name) + '</button>';
        }).join('') + '</div></div>';
    }).join('');
    $('saveBtn').disabled = !residentId || picked.size === 0;
    renderTimes();
  }

  // 外出・通所は「出発」と「もどり」の 2 つの時計
  function renderTimes() {
    const k = pickedKind();
    const back = !!(k && k.back);
    const wasHidden = $('backBlock').hidden;
    $('departLabel').textContent = back ? '出発' : '時刻';
    $('backBlock').hidden = !back;
    $('backWheelWrap').classList.toggle('off', !$('backOn').checked);
    // 開いたときは、出発の 1 時間あと
    if (back && wasHidden && !$('inputModal').hidden) {
      const t = (wheelValue($('wheelH')) * 60 + wheelValue($('wheelM')) * MIN_STEP + 60) % (24 * 60);
      setTime(Math.floor(t / 60), (t % 60) / MIN_STEP, 'backWheel');
    }
  }

  // コメント欄: 内容に合った文を入れる。自分で書きかえた文は消さない
  let lastTemplate = '';
  function fillNote() {
    const k = pickedKind();
    const box = $('newNote');
    const cur = box.value.trim();
    const next = k ? k.note : '';
    if (!cur || cur === lastTemplate.trim()) box.value = next;
    lastTemplate = next;
    // 行の多い文(お薬空包確認など)も全部見えるように
    box.rows = Math.max(3, box.value.split('\n').length + 1);
  }


  // 選んだ人のその日の記録(メイン)
  function renderList() {
    renderCtx();
    const p = residentId ? Rooms.resident(residentId) : null;
    $('listCard').hidden = !p;
    if (!p) { closeInput(); return; }
    $('inputTitle').textContent = p.name + ' さん';
    $('listTitle').textContent = p.name + ' さんの記録(' + Rooms.dateText(date) + ')';

    const mine = records.filter(function (r) { return r.resident_id === residentId; });
    const myVitals = vitals.filter(function (v) { return v.resident_id === residentId; });

    // 記録とバイタルを時刻の順に並べる
    const items = mine.map(function (r) { return { t: String(r.record_time).slice(0, 5), r: r }; })
      .concat(myVitals.map(function (v) { return { t: Vitals.time(v.measured_time), v: v }; }))
      .sort(function (a, b) { return a.t < b.t ? -1 : a.t > b.t ? 1 : 0; });

    // きょうの日課。同じ内容の記録がその日にあれば記録済みとして日課の一覧から外し、
    // その記録(日課 1 つにつき 1 件)に「日課」の印を付ける
    const rts = Routines.ofDay(residentId, date);
    const fromRoutine = new Set();
    const todo = rts.filter(function (rt) {
      const hit = items.find(function (it) {
        return !fromRoutine.has(it) && (it.v ? rt.content === 'バイタル' : it.r.kind === rt.content);
      });
      if (hit) fromRoutine.add(hit);
      return !hit;
    });
    // 日課がない日も出して、プロファイルの日課へ行けるようにする
    $('rtToday').hidden = false;
    $('rtNone').hidden = todo.length > 0;
    $('rtNone').textContent = rts.length ? 'きょうの日課はすべて記録しました' : 'きょうの日課はありません';
    $('rtEditLink').href = 'profile.html?resident=' + encodeURIComponent(residentId) + '&from=records#routines';
    $('rtTodayList').innerHTML = todo.map(function (rt) {
      return '<li><span class="t">' + esc(Routines.time(rt.routine_time)) + '</span><span class="c">' + esc(rt.content) + '</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-routine="' + esc(rt.id) + '"><i class="ti ti-pencil"></i>記録</button></li>';
    }).join('');
    const routineMark = '<span class="rec-routine"><i class="ti ti-calendar-repeat"></i>日課</span>';
    $('recList').innerHTML = items.map(function (it) {
      if (it.v) {
        return '<li>' +
          '<span class="rec-time">' + esc(it.t) + '</span>' +
          '<span class="rec-kind"><i class="ti ti-heartbeat"></i>バイタル' + (fromRoutine.has(it) ? routineMark : '') +
            '<span class="rec-note">' + esc(Vitals.summary(it.v)) + '</span></span>' +
          '<button type="button" class="icon-btn" data-vital="1" title="バイタルを見る・取消" aria-label="バイタル"><i class="ti ti-pencil"></i></button>' +
          '</li>';
      }
      const r = it.r;
      return '<li>' +
        '<span class="rec-time">' + esc(String(r.record_time).slice(0, 5)) + '</span>' +
        '<span class="rec-kind"><i class="ti ' + kindIcon(r.kind) + '"></i>' + esc(r.kind) + (fromRoutine.has(it) ? routineMark : '') +
          (r.note ? '<span class="rec-note"><i class="ti ti-message"></i> ' + esc(r.note) + '</span>' : '') + '</span>' +
        '<button type="button" class="icon-btn" data-edit="' + esc(r.id) + '" title="時刻・コメント・取消" aria-label="編集"><i class="ti ti-pencil"></i></button>' +
        '</li>';
    }).join('');
    $('listMsg').hidden = items.length > 0;
  }

  async function loadRecords() {
    records = houseId ? await App.rpc('get_daily_records', { p_house_id: houseId, p_date: date }) : [];
    try {
      vitals = houseId ? await App.rpc('get_vitals', { p_from: date, p_to: date }) : [];
    } catch (err) {
      console.error(err);
      vitals = [];
    }
  }

  async function selectHouse(id) {
    houseId = id;
    residentId = null;
    try { localStorage.setItem(HOUSE_KEY, id); } catch (e) { /* 保存できなくても続ける */ }
    renderHouses();
    try {
      await loadRecords();
    } catch (err) {
      console.error(err);
      records = [];
      App.setStatus($('listStatus'), '記録を読み込めませんでした', 'err');
    }
    renderVisits();
    renderPeople();
    renderList();
  }

  function selectResident(id) {
    if (id !== residentId) $('newNote').value = '';   // コメントはその人だけのもの
    residentId = id;
    App.setStatus($('listStatus'), '');
    renderPeople();
    renderList();
    // PC は記録が右に並んで見えるので、スクロールしない
    if (!window.matchMedia('(min-width: 1000px)').matches) $('listCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ===== 入力のダイアログ =====
  function openInput() {
    if (!residentId) return;
    App.setStatus($('saveStatus'), '');
    $('inputModal').hidden = false;
    // 非表示のあいだはスクロール位置が消えるので、覚えておいた時刻に合わせ直す
    setTime(savedH, savedM);
    $('backBlock').hidden = true;   // renderKinds で開き直して、もどりの時刻を出発の 1 時間あとにする
    renderKinds();
    fillNote();
  }
  function closeInput() {
    $('inputModal').hidden = true;
    // 日課から開いたときのチップは、その場だけ
    if (routineKind) {
      if (picked.has(routineKind.name)) picked.clear();
      routineKind = null;
    }
  }

  // 日課の時刻と内容で、新しい入力を開く(そこから直して記録できる)
  function openFromRoutine(id) {
    const rt = Routines.list.find(function (x) { return x.id === id; });
    if (!rt) return;
    const t = Routines.time(rt.routine_time).split(':');
    const n = roundTime(+t[0], +t[1]);
    savedH = n[0]; savedM = n[1];
    const chip = KINDS.find(function (k) { return k.name === rt.content; });
    if (chip && chip.vital) { openVital(Routines.time(rt.routine_time)); return; }
    routineKind = chip ? null : { name: rt.content, icon: 'ti-calendar-check', note: '' };
    picked.clear();
    picked.add(rt.content);
    $('newNote').value = '';
    lastTemplate = '';
    openInput();
  }

  // バイタルのダイアログ(js/vitals.js)。新しい入力からは、その時刻で開く
  function openVital(time) {
    const p = residentId ? Rooms.resident(residentId) : null;
    if (!p) return;
    closeInput();
    Vitals.openForm({
      residentId: p.id, name: p.name, date: date, time: time,
      ctxHtml: '<div class="ctx-doing"><i class="ti ti-heartbeat"></i>' + esc(p.name) + ' さんのバイタルを入力中です</div>' + ctxLine(),
      onChange: function (rows, msg) {
        const id = p.id;
        vitals = vitals.filter(function (v) { return v.resident_id !== id; }).concat(rows);
        if (msg) App.setStatus($('listStatus'), msg, 'ok');
        renderPeople();
        renderList();
      },
    });
  }

  // ホイールが非表示のあいだも時刻を覚えておく
  let savedH = 0, savedM = 0;
  function rememberTime() {
    if ($('inputModal').hidden) return;
    savedH = wheelValue($('wheelH')); savedM = wheelValue($('wheelM'));
  }

  function addRecords(kind, time, note) {
    return App.rpc('add_daily_records', {
      p_resident_id: residentId, p_house_id: houseId, p_date: date, p_time: time, p_kinds: [kind], p_note: note,
    });
  }

  async function onSave() {
    const k = pickedKind();
    if (!residentId || !k) return;
    const btn = $('saveBtn');
    const status = $('saveStatus');
    const t = timeText();
    const withBack = !!k.back && $('backOn').checked;
    const tb = withBack ? timeText('backWheel') : null;
    if (withBack && tb <= t) return App.setStatus(status, 'もどりの時刻は、出発より後にしてください', 'err');

    btn.disabled = true;
    let done = [];
    try {
      done = done.concat(await addRecords(k.name, t, $('newNote').value.trim() || null) || []);
      if (withBack) done = done.concat(await addRecords('もどり', tb, null) || []);
    } catch (err) {
      console.error(err);
      records = records.concat(done);
      sortRecords();
      App.setStatus(status, done.length ? t + ' ' + k.name + ' は記録しましたが、もどりを記録できませんでした' : '記録できませんでした。通信状況を確認してください', 'err');
      btn.disabled = false;
      renderPeople();
      renderList();
      return;
    }
    records = records.concat(done);
    sortRecords();
    rememberTime();
    btn.disabled = false;
    // コメントはその記録だけのものなので消す(時刻と内容は残す)
    $('newNote').value = '';
    lastTemplate = '';
    closeInput();
    App.setStatus($('listStatus'), t + ' ' + k.name + (withBack ? '・' + tb + ' もどり' : '') + ' を記録しました', 'ok');
    // 時刻と内容はそのまま残す(次の利用者に同じ内容をすぐ記録できるように)
    renderPeople();
    renderList();
  }


  // ===== 記録の編集(コメント・取消) =====
  let editId = null;
  let editStartText = '';    // 開いたときのホイールの時刻

  function openEdit(id) {
    const r = records.find(function (x) { return x.id === id; });
    if (!r) return;
    editId = id;
    const p = Rooms.resident(r.resident_id);
    $('editTitle').textContent = (p ? p.name + ' さん' : '記録の編集');
    $('editWhat').innerHTML = '<i class="ti ' + kindIcon(r.kind) + '"></i>' + esc(r.kind);
    $('editNote').value = r.note || '';
    App.setStatus($('editStatus'), '');
    $('editModal').hidden = false;
    // 10 分きざみでない時刻(9:37 など)は近い位置に合わせる。ホイールを動かさなければ元の時刻のまま保存する
    const t = String(r.record_time).slice(0, 5).split(':');
    const rt = roundTime(+t[0], +t[1]);
    setTime(rt[0], rt[1], 'editWheel');
    editStartText = timeText('editWheel');
  }
  function closeEdit() { $('editModal').hidden = true; editId = null; }

  async function onEditSave() {
    const id = editId;
    if (!id) return;
    const btn = $('editSave');
    btn.disabled = true;
    App.setStatus($('editStatus'), '保存しています...');
    let row;
    try {
      const r0 = records.find(function (x) { return x.id === id; });
      const wheel = timeText('editWheel');
      const time = wheel === editStartText && r0 ? String(r0.record_time).slice(0, 5) : wheel;
      row = await App.rpc('update_daily_record', { p_id: id, p_time: time, p_note: $('editNote').value });
    } catch (err) {
      console.error(err);
      App.setStatus($('editStatus'), '保存できませんでした。通信状況を確認してください', 'err');
      btn.disabled = false;
      return;
    }
    btn.disabled = false;
    const r = records.find(function (x) { return x.id === id; });
    if (r && row) { r.note = row.note; r.record_time = row.record_time; }
    sortRecords();
    closeEdit();
    App.setStatus($('listStatus'), '記録を直しました', 'ok');
    renderList();
  }

  async function onVoid() {
    const id = editId;
    const r = records.find(function (x) { return x.id === id; });
    if (!r) return;
    if (!confirm(String(r.record_time).slice(0, 5) + ' ' + r.kind + ' の記録を取り消しますか？')) return;
    try {
      await App.rpc('void_daily_record', { p_id: id });
    } catch (err) {
      console.error(err);
      App.setStatus($('editStatus'), '取り消せませんでした', 'err');
      return;
    }
    records = records.filter(function (x) { return x.id !== id; });
    closeEdit();
    App.setStatus($('listStatus'), '記録を取り消しました', 'ok');
    renderPeople();
    renderList();
  }

  App.boot({
    active: 'records',
    onReady: async function () {
      await Promise.all([Rooms.load(), StaffDay.loadMasters(), StaffDay.loadShifts(date),
        Routines.load().catch(function (err) { console.error(err); Routines.list = []; })]);
      $('rtTodayList').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-routine]');
        if (b) openFromRoutine(b.dataset.routine);
      });

      buildWheel($('wheelH'), 24, 1);
      buildWheel($('wheelM'), 60 / MIN_STEP, MIN_STEP);
      buildWheel($('backWheelH'), 24, 1);
      buildWheel($('backWheelM'), 60 / MIN_STEP, MIN_STEP);
      $('backOn').addEventListener('change', renderTimes);
      buildWheel($('editWheelH'), 24, 1);
      buildWheel($('editWheelM'), 60 / MIN_STEP, MIN_STEP);
      $('wheelH').addEventListener('scroll', rememberTime, { passive: true });
      $('wheelM').addEventListener('scroll', rememberTime, { passive: true });
      $('nowBtn').addEventListener('click', function () { setNow(); rememberTime(); });

      $('houseChips').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-house]');
        if (b && b.dataset.house !== houseId) selectHouse(b.dataset.house);
      });
      $('personGrid').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-resident]');
        if (b) selectResident(b.dataset.resident);
      });
      $('kindGrid').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-kind]');
        if (!b) return;
        const k = b.dataset.kind;
        const kd = KINDS.find(function (x) { return x.name === k; });
        if (kd && kd.vital) { openVital(timeText()); return; }
        // 選べるのは 1 つだけ。同じものをもう一度押すと外れる
        const was = picked.has(k);
        picked.clear();
        if (!was) picked.add(k);
        renderKinds();
        fillNote();
      });
      $('recList').addEventListener('click', function (e) {
        const b = e.target.closest('button[data-edit]');
        if (b) openEdit(b.dataset.edit);
        if (e.target.closest('button[data-vital]')) openVital();
      });
      $('saveBtn').addEventListener('click', onSave);
      $('ctxBar').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
      watchHouseCard();
      $('newBtn').addEventListener('click', openInput);
      $('inputClose').addEventListener('click', closeInput);
      $('inputModal').addEventListener('click', function (e) { if (e.target === this) closeInput(); });
      $('editClose').addEventListener('click', closeEdit);
      $('editModal').addEventListener('click', function (e) { if (e.target === this) closeEdit(); });
      $('editSave').addEventListener('click', onEditSave);
      $('editVoid').addEventListener('click', onVoid);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeInput(); closeEdit(); } });
      $('prevDay').addEventListener('click', function () { shiftDate(-1); });
      $('nextDay').addEventListener('click', function () { shiftDate(1); });
      $('dateInput').addEventListener('change', function () { changeDate(this.value); });

      renderDate();

      // はじめの時刻は「いま」
      const n = nowRounded();
      savedH = n[0]; savedM = n[1];

      // 前回選んだ施設(施設が 1 つだけならそれ)
      const houses = activeHouses();
      let last = null;
      try { last = localStorage.getItem(HOUSE_KEY); } catch (e) { /* noop */ }
      const start = houses.find(function (h) { return h.id === last; }) || (houses.length === 1 ? houses[0] : null);
      renderHouses();
      if (start) await selectHouse(start.id);
    },
  });
</script>

</body>
</html>
